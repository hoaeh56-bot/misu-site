<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gift Boost</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: radial-gradient(circle at 50% 20%, #1a1a24 0%, #000000 70%); 
            color: #fff; 
            display: flex; 
            flex-direction: column; 
            min-height: 100vh; 
            overflow-y: auto; 
            overflow-x: hidden;
        }

        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; z-index: 10; }
        .balance-pill { display: flex; align-items: center; border: 1px solid #ffd700; padding: 6px 14px; border-radius: 20px; gap: 6px; color: #ffd700; font-weight: 700; font-size: 14px; background: rgba(255, 215, 0, 0.05); }
        .btn-topup { background: #ffd700; color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; }

        .wheel-zone { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 0; position: relative; }
        
        .wheel-outer { position: relative; width: 260px; height: 260px; display: flex; justify-content: center; align-items: center; }
        
        .wheel-bg { 
            position: absolute; 
            width: 100%; 
            height: 100%; 
            border-radius: 50%; 
            border: 16px solid #14141e; 
            background: #09090e; 
            box-shadow: inset 0 0 20px rgba(0,0,0,1); 
        }
        
        /* ОРАНЖЕВАЯ ПОЛОСА (SVG, без rotate) */
        .progress-svg {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        
        .progress-circle {
            fill: none;
            stroke: #ff8c00;
            stroke-width: 16;
            stroke-linecap: round;
            /* Начинаем с 6 часов (снизу) и идем по часовой */
            stroke-dasharray: 0 1000;
            transition: stroke-dasharray 0.3s ease;
        }

        .wheel-inner { position: absolute; width: 160px; height: 160px; border-radius: 50%; background: #000; z-index: 3; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; }
        
        .percent-num { font-size: 32px; font-weight: 800; letter-spacing: -1px; transition: opacity 0.3s; color: #fff; }
        .percent-lbl { font-size: 10px; color: #666; margin-top: 2px; transition: opacity 0.3s; }

        /* Анимация результата */
        .result-container { position: absolute; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100%; opacity: 0; transition: opacity 0.3s ease; z-index: 10; pointer-events: none; background: #000; }
        .result-container.show { opacity: 1; }
        
        .result-icon { width: 40px; height: 40px; margin-bottom: 5px; stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 0.5s ease forwards; }
        .result-text { font-size: 15px; font-weight: 800; text-align: center; }
        .result-text.win { color: #4cd964; }
        .result-text.lose { color: #ff4444; font-size: 14px; }
        
        .result-gift-info { text-align: center; margin-top: 2px; }
        .result-gift-name { font-size: 11px; font-weight: 600; color: #fff; }
        .result-gift-id { font-size: 8px; color: #888; }

        @keyframes draw { to { stroke-dashoffset: 0; } }

        /* Стрелка (Смотрит вниз) */
        .arrow-container { position: absolute; width: 260px; height: 260px; pointer-events: none; z-index: 5; transition: transform 3.5s cubic-bezier(0.1, 0.7, 0.1, 1); transform: rotate(0deg); }
        .arrow-svg { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 20px; height: 32px; filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.8)); }

        .gift-cards { display: flex; justify-content: center; gap: 12px; margin-top: 15px; z-index: 10; }
        
        .gift-card { 
            width: 135px; 
            border-radius: 16px; 
            padding: 8px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            position: relative; 
            cursor: pointer; 
            transition: 0.2s;
            border: 2px solid transparent;
            background: #111116; 
        }
        .gift-card.active { border-color: #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); }

        .gift-card.westside { background: linear-gradient(180deg, #1a2a5a 0%, #0a1030 100%); }
        .gift-card.xmas { background: linear-gradient(180deg, #3a1a4a 0%, #1a0a2a 100%); }

        .gift-price { 
            position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); color: #fff; 
            padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; 
            display: flex; align-items: center; gap: 4px; backdrop-filter: blur(4px);
        }
        .gift-price.blue { background: #007bff; }
        
        .gift-image-wrapper {
            width: 70px; height: 70px; margin: 20px 0 10px;
            display: flex; justify-content: center; align-items: center;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-6px); } 100% { transform: translateY(0px); } }

        .gift-img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 10px 10px rgba(0,0,0,0.5)); }
        .gift-name { font-size: 13px; font-weight: 700; text-align: center; color: #fff; }
        .gift-sub { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 2px; }

        .controls { padding: 15px; z-index: 10; display: flex; flex-direction: column; gap: 10px; }
        
        .action-row { display: flex; gap: 8px; }
        .btn-icon { width: 45px; height: 45px; background: #111116; border: 1px solid #22222a; border-radius: 12px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .btn-icon svg { width: 20px; height: 20px; stroke: #888; fill: none; stroke-width: 2; }
        
        .btn-boost { flex-grow: 1; background: #ffd700; color: #000; border: none; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-boost:active { transform: scale(0.98); }
        .btn-boost:disabled { background: #1a1a24; color: #444; }
        
        .chances-grid { display: flex; justify-content: center; gap: 6px; width: 100%; }
        .chance-btn { flex: 1; max-width: 60px; background: #111116; border: 1px solid #22222a; color: #666; padding: 10px 0; border-radius: 10px; font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; transition: 0.2s; }
        .chance-btn.active { border-color: #ffd700; color: #ffd700; background: rgba(255, 215, 0, 0.05); }
        .chance-btn.red { border-color: #ff4444; color: #ff4444; }
        .chance-btn.yellow { border-color: #ffd700; color: #ffd700; }
        .chance-btn.green { border-color: #44ff44; color: #44ff44; }

        .tabs-container { padding: 0 15px 15px; }
        .tabs { display: flex; background: #0a0a0f; border-radius: 14px; padding: 5px; border: 1px solid #1a1a25; }
        .tab { flex: 1; text-align: center; padding: 12px; font-size: 13px; font-weight: 700; color: #555; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .tab.active { background: #1c1c28; color: #fff; border: 1px solid #2a2a35; }

        .list-container { padding: 0 15px 30px; flex-grow: 1; }
        
        .grid-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .grid-item {
            background: #111116;
            border: 1px solid #22222a;
            border-radius: 12px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }
        
        .grid-item.westside { background: linear-gradient(180deg, #1a2a5a 0%, #0a1030 100%); border-color: #2a3a6a; }
        .grid-item.xmas { background: linear-gradient(180deg, #3a1a4a 0%, #1a0a2a 100%); border-color: #5a2a7a; }
        
        .grid-item .gift-price { position: absolute; top: 6px; right: 6px; font-size: 10px; padding: 2px 6px; }
        .grid-item .gift-img { width: 50px; height: 50px; margin: 15px 0 5px; }
        .grid-item .gift-name { font-size: 12px; font-weight: 600; text-align: center; }
        .grid-item .gift-sub { font-size: 10px; color: #888; }
        
        .btn-upgrade { background: #ffd700; color: #000; border: none; padding: 6px 10px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; margin-top: 8px; width: 100%; text-align: center; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="header">
        <div class="balance-pill"><span>⭐</span> <span id="balanceDisplay">800.00</span></div>
        <button class="btn-topup" onclick="tg.showAlert('Пополнение в разработке')">+ Пополнить</button>
    </div>

    <div class="wheel-zone">
        <div class="wheel-outer">
            <div class="wheel-bg"></div>
            
            <!-- ОРАНЖЕВАЯ ПОЛОСА (SVG) -->
            <svg class="progress-svg" viewBox="0 0 260 260">
                <circle class="progress-circle" id="progressCircle" cx="130" cy="130" r="122" />
            </svg>
            
            <div class="wheel-inner">
                <div id="percentContainer" style="display: flex; flex-direction: column; align-items: center;">
                    <div class="percent-num" id="chanceDisplay">25.00%</div>
                    <div class="percent-lbl" id="chanceLabel">Средний шанс</div>
                </div>

                <div class="result-container" id="resultContainer">
                    <svg class="result-icon" id="resultIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></svg>
                    <div class="result-text" id="resultText"></div>
                    <div class="result-gift-info" id="resultGiftInfo">
                        <div class="result-gift-name" id="resultGiftName"></div>
                        <div class="result-gift-id" id="resultGiftId"></div>
                    </div>
                </div>
            </div>
            
            <div class="arrow-container" id="arrowContainer">
                <svg class="arrow-svg" viewBox="0 0 20 32" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 32 L0 12 L6 12 L6 0 L14 0 L14 12 L20 12 Z" fill="#ffd700"/>
                </svg>
            </div>
        </div>
    </div>

    <div class="gift-cards">
        <div class="gift-card westside active" onclick="selectGift(this, 100, 'Westside Ring', '#136')">
            <div class="gift-price">⭐ 100</div>
            <div class="gift-image-wrapper">
                <img src="https://cdn3d.iconscout.com/3d/premium/thumb/hand-3d-icon-download-in-png-blend-fbx-gltf-file-formats--palm-five-fingers-gestures-pack-sign-symbols-5009693.png" class="gift-img" alt="Westside Ring">
            </div>
            <div class="gift-name">Westside Ring</div>
            <div class="gift-sub">#136</div>
        </div>
        
        <div class="gift-card xmas" onclick="selectGift(this, 3.19, 'Xmas Stocking', '#200912')">
            <div class="gift-price blue">🌍 3.19</div>
            <div class="gift-image-wrapper" style="animation-delay: 1s;">
                <img src="https://cdn-icons-png.flaticon.com/512/4213/4213230.png" class="gift-img" alt="Подарок">
            </div>
            <div class="gift-name">Xmas Stocking</div>
            <div class="gift-sub">#200912</div>
        </div>
    </div>

    <div class="controls">
        <div class="action-row">
            <div class="btn-icon"><svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg></div>
            <button class="btn-boost" id="spinBtn" onclick="spin()">Забустить</button>
            <div class="btn-icon" onclick="openSettings()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></div>
        </div>
        
        <div class="chances-grid">
            <div class="chance-btn" onclick="setChance(50, this)">x2</div>
            <div class="chance-btn active" onclick="setChance(25, this)">x4</div>
            <div class="chance-btn" onclick="setChance(1, this)">x100</div>
            <div class="chance-btn red" onclick="setChance(35, this)">35%</div>
            <div class="chance-btn yellow" onclick="setChance(55, this)">55%</div>
            <div class="chance-btn green" onclick="setChance(75, this)">75%</div>
        </div>
    </div>

    <div class="tabs-container">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('inv', this)">Мои предметы</div>
            <div class="tab" onclick="switchTab('wish', this)">Желаемые подарки</div>
        </div>
    </div>

    <div class="list-container" id="inv-section">
        <div class="grid-list" id="inv-list">
            <div class="grid-item westside">
                <div class="gift-price">⭐ 100</div>
                <img src="https://cdn3d.iconscout.com/3d/premium/thumb/hand-3d-icon-download-in-png-blend-fbx-gltf-file-formats--palm-five-fingers-gestures-pack-sign-symbols-5009693.png" class="gift-img" alt="Westside Ring">
                <div class="gift-name">Westside Ring</div>
                <div class="gift-sub">#136</div>
                <button class="btn-upgrade" onclick="startUpgrade('Westside Ring')">Апгрейд</button>
            </div>
        </div>
    </div>

    <div class="list-container hidden" id="wish-section">
        <div class="grid-list">
            <div class="grid-item">
                <div class="gift-price">⭐ 100,000</div>
                <img src="https://cdn-icons-png.flaticon.com/512/4213/4213230.png" class="gift-img" alt="Redo">
                <div class="gift-name">Redo</div>
                <div class="gift-sub">#99999</div>
            </div>
            <div class="grid-item xmas">
                <div class="gift-price blue">🌍 3.19</div>
                <img src="https://cdn-icons-png.flaticon.com/512/4213/4213230.png" class="gift-img" alt="Xmas Stocking">
                <div class="gift-name">Xmas Stocking</div>
                <div class="gift-sub">#200912</div>
            </div>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.setHeaderColor('#000000'); }

        let balance = 800.00;
        let chance = 25;
        let rotation = 0;
        let isSpinning = false;
        let betAmount = 100;
        let currentGiftName = 'Westside Ring';
        let currentGiftId = '#136';
        let currentGiftImg = 'https://cdn3d.iconscout.com/3d/premium/thumb/hand-3d-icon-download-in-png-blend-fbx-gltf-file-formats--palm-five-fingers-gestures-pack-sign-symbols-5009693.png';

        const circle = document.getElementById('progressCircle');
        const circumference = 2 * Math.PI * 122;

        function updateUI() {
            document.getElementById('balanceDisplay').innerText = balance.toFixed(2);
            document.getElementById('chanceDisplay').innerText = chance.toFixed(2) + "%";
            
            // Визуальный минимум 5% для полосы
            let visualProgress = chance < 5 ? 5 : chance;
            let strokeLength = (visualProgress / 100) * circumference;
            
            // Устанавливаем длину закрашенной части
            circle.style.strokeDasharray = `${strokeLength} ${circumference}`;
            
            // Меняем текст при 1%
            if (chance === 1) {
                document.getElementById('chanceLabel').innerText = 'ВЫСОКИЙ РИСК';
                document.getElementById('chanceLabel').style.color = '#ff4444';
            } else {
                document.getElementById('chanceLabel').innerText = 'Средний шанс';
                document.getElementById('chanceLabel').style.color = '#666';
            }
        }

        function setChance(val, el) {
            if (isSpinning) return;
            chance = val;
            document.querySelectorAll('.chance-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            updateUI();
        }

        function selectGift(el, price, name, id) {
            if (isSpinning) return;
            document.querySelectorAll('.gift-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            betAmount = price;
            currentGiftName = name;
            currentGiftId = id;
            currentGiftImg = el.querySelector('img').src;
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            
            if (tab === 'inv') {
                document.getElementById('inv-section').classList.remove('hidden');
                document.getElementById('wish-section').classList.add('hidden');
            } else {
                document.getElementById('inv-section').classList.add('hidden');
                document.getElementById('wish-section').classList.remove('hidden');
            }
        }

        function startUpgrade(giftName) {
            if (tg) {
                tg.showAlert(`Выбран предмет для апгрейда: ${giftName}.`);
            } else {
                alert(`Выбран предмет для апгрейда: ${giftName}.`);
            }
        }

        function addToInventory(name, id, imgSrc) {
            const list = document.getElementById('inv-list');
            const newItem = document.createElement('div');
            newItem.className = 'grid-item westside';
            newItem.innerHTML = `
                <div class="gift-price">⭐ ${betAmount}</div>
                <img src="${imgSrc}" class="gift-img" alt="${name}">
                <div class="gift-name">${name}</div>
                <div class="gift-sub">${id}</div>
                <button class="btn-upgrade" onclick="startUpgrade('${name}')">Апгрейд</button>
            `;
            list.appendChild(newItem);
        }

        function spin() {
            if (isSpinning) return;
            if (balance < betAmount) {
                if (tg) tg.showAlert("Недостаточно средств!");
                return;
            }

            isSpinning = true;
            const btn = document.getElementById('spinBtn');
            const arrow = document.getElementById('arrowContainer');
            const percentContainer = document.getElementById('percentContainer');
            const resultContainer = document.getElementById('resultContainer');
            const resultIcon = document.getElementById('resultIcon');
            const resultText = document.getElementById('resultText');
            const resultGiftInfo = document.getElementById('resultGiftInfo');
            const resultGiftName = document.getElementById('resultGiftName');
            const resultGiftId = document.getElementById('resultGiftId');

            resultContainer.classList.remove('show');
            percentContainer.style.opacity = '1';
            
            btn.innerText = "Крутим...";
            btn.disabled = true;

            balance -= betAmount;
            updateUI();

            let isWin = (Math.random() * 100) <= chance;

            let targetDeg = 0;
            
            if (isWin) {
                const startAngle = 180;
                const endAngle = 180 + (chance / 100) * 360;
                targetDeg = Math.floor(Math.random() * (endAngle - startAngle) + startAngle);
            } else {
                const startAngle = 180;
                const endAngle = 180 + (chance / 100) * 360;
                do {
                    targetDeg = Math.floor(Math.random() * 360);
                } while (targetDeg > startAngle && targetDeg < endAngle);
            }

            let currentMod = rotation % 360;
            let diff = targetDeg - currentMod;
            if (diff < 0) diff += 360;

            rotation += (5 * 360) + diff;
            arrow.style.transform = `rotate(${rotation}deg)`;

            setTimeout(() => {
                arrow.style.transition = 'none';
                rotation = rotation % 360;
                arrow.style.transform = `rotate(${rotation}deg)`;
                
                setTimeout(() => { 
                    arrow.style.transition = 'transform 3.5s cubic-bezier(0.1, 0.7, 0.1, 1)'; 
                }, 50);

                percentContainer.style.opacity = '0';

                if (isWin) {
                    resultIcon.innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';
                    resultIcon.style.color = '#4cd964';
                    resultText.innerText = 'Удача!';
                    resultText.className = 'result-text win';
                    resultGiftInfo.style.display = 'block';
                    resultGiftName.innerText = currentGiftName;
                    resultGiftId.innerText = currentGiftId;
                    
                    let multiplier = 100 / chance;
                    let winAmount = Math.floor(betAmount * multiplier);
                    balance += winAmount;
                    
                    addToInventory(currentGiftName, currentGiftId, currentGiftImg);

                    if (tg) tg.showAlert(`🎉 ВЫИГРАЛ!\n+${winAmount} ⭐`);
                } else {
                    resultIcon.innerHTML = '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>';
                    resultIcon.style.color = '#ff4444';
                    resultText.innerText = 'Неудача';
                    resultText.className = 'result-text lose';
                    resultGiftInfo.style.display = 'none';
                    
                    if (tg) tg.showAlert(`💀 ПРОИГРАЛ!\n-${betAmount} ⭐`);
                }

                resultContainer.classList.add('show');
                updateUI();

                setTimeout(() => {
                    resultContainer.classList.remove('show');
                    percentContainer.style.opacity = '1';
                    
                    isSpinning = false;
                    btn.disabled = false;
                    btn.innerText = "Забустить";
                }, 3000);

            }, 3600);
        }

        updateUI();
    </script>
</body>
</html>

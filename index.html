<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Halloween Case</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <!-- Шапка с балансом -->
    <header class="top-bar">
        <h1 class="logo">🎃 Halloween Case</h1>
        <div class="balance-box">
            <span id="balance-amount">0</span> 🎃
        </div>
    </header>

    <main class="container">
        <!-- Секция кейсов -->
        <h2 class="section-title">Кейсы</h2>
        <div class="cases-grid">
            <div class="case-card" onclick="openCase('hell', 100)">
                <div class="case-icon">📦</div>
                <h3>Адский кейс</h3>
                <p>Цена: 100 🎃</p>
            </div>
            <div class="case-card" onclick="openCase('vip', 500)">
                <div class="case-icon">💎</div>
                <h3>Кейс Тыквы</h3>
                <p>Цена: 500 🎃</p>
            </div>
        </div>

        <!-- Секция Апгрейдера -->
        <h2 class="section-title" style="margin-top: 30px;">Апгрейдер</h2>
        <div class="upgrader-panel">
            <div class="upgrader-slots">
                <div class="slot" id="slot-1">
                    <span class="plus">+</span>
                    <p>Выбери</p>
                </div>
                <div class="upgrader-arrow">➜</div>
                <div class="slot" id="slot-2">
                    <span class="plus">+</span>
                    <p>Цель</p>
                </div>
            </div>
            <div class="upgrader-chance">
                <span id="chance-text">0%</span>
            </div>
            <button class="main-btn" onclick="upgrade()">Апгрейд</button>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>

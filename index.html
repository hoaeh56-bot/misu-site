<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boost</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>
<style>
:root{--bg:#09090c;--card:#15151b;--card2:#1d1d25;--tx:#fff;--mut:#7b7b88;--y:#ffc61a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
body{background:radial-gradient(120% 40% at 50% 0%,#2a1a05 0%,transparent 60%),var(--bg)}
button{font-family:inherit;cursor:pointer}
.app{max-width:480px;margin:0 auto;padding:18px 22px 130px}
.top{display:flex;justify-content:space-between;align-items:center}
.pill{background:rgba(255,255,255,.07);border-radius:30px;padding:10px 18px;font-weight:600;font-size:15px;color:#e8e8ee;display:flex;align-items:center;gap:8px;border:0}
.plus{width:26px;height:26px;border-radius:50%;background:var(--y);color:#2a1c00;display:grid;place-items:center;font-weight:900;font-size:18px;margin-right:-8px}
.st{width:20px;height:20px;flex:none}
.gauge{position:relative;width:88%;margin:26px auto 0}
.gauge svg{width:100%;display:block;overflow:visible}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:14%}
.center b{font-size:30px;letter-spacing:-.5px}.center span{color:var(--mut);font-size:13px;margin-top:2px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:30px}
.c{border-radius:28px;height:240px;position:relative;overflow:hidden;background:linear-gradient(160deg,#20202a,#14141a);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.badge{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.55);padding:6px 13px;border-radius:20px;font-weight:700;font-size:14px;white-space:nowrap;display:flex;gap:6px;align-items:center;z-index:3}
.art{position:absolute;inset:0}
.ga{position:relative;overflow:hidden;border-radius:22px;background-size:cover;background-position:center;display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.art .ga{border-radius:0}
.ga .gi{width:66%;height:66%;object-fit:contain;filter:drop-shadow(0 8px 10px rgba(0,0,0,.45));animation:fl 3.2s ease-in-out infinite}
.ga .cut{position:absolute;inset:7%;width:86%;height:86%;object-fit:contain;filter:drop-shadow(0 8px 12px rgba(0,0,0,.4));animation:fl 3.4s ease-in-out infinite}
.c .gi{margin-top:-16%}.c .cut{inset:12% 8% 24%;width:84%;height:64%}
.lt{position:absolute;inset:0}
@keyframes fl{0%,100%{transform:translateY(0) rotate(-1.5deg) scale(1)}50%{transform:translateY(-5%) rotate(2deg) scale(1.04)}}
.nm{position:absolute;left:12px;right:12px;bottom:12px;background:rgba(0,0,0,.58);border-radius:18px;padding:10px 14px;font-weight:600;font-size:15px;z-index:3;backdrop-filter:blur(4px)}
.nm small{display:block;color:#b4b4c0;font-weight:400;font-size:13px;margin-top:2px}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;gap:16px;padding-top:26px}
.add{border:2px solid var(--y);background:rgba(255,198,26,.06);color:#fff;border-radius:30px;padding:13px 22px;font-weight:700;font-size:17px;box-shadow:0 0 20px rgba(255,198,26,.18)}
.empty p{margin:0 18px;text-align:center;color:#9a9aa6;font-size:14px;position:absolute;bottom:26px}
.stake{display:flex;align-items:center;gap:16px;margin-top:26px}
.stake .l{min-width:92px}.stake .l small{color:var(--mut);font-size:16px;display:block}.stake .l b{display:flex;gap:6px;align-items:center;font-size:21px;margin-top:4px}
input[type=range]{flex:1;-webkit-appearance:none;height:12px;border-radius:8px;background:var(--card2);outline:0}
input[type=range]:disabled{opacity:.4}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--y);box-shadow:0 0 14px rgba(255,198,26,.5)}
input[type=range]::-moz-range-thumb{width:30px;height:30px;border:0;border-radius:50%;background:var(--y)}
.sp{background:var(--card);border-radius:24px;padding:14px 16px;font-weight:800;font-size:19px;min-width:76px;text-align:center}
.hint{margin-top:12px;font-size:14px;color:var(--mut);min-height:20px}.hint.e{color:#ff7a7a}
.row{display:flex;gap:14px;margin-top:18px;align-items:center}
.go{flex:1;height:60px;border:0;border-radius:30px;background:linear-gradient(#ffd23a,#ffae00);font-size:20px;font-weight:800;color:#2a1c00;box-shadow:0 8px 26px rgba(255,170,0,.28)}
.go:active{transform:scale(.98)}.go:disabled{opacity:.55}
.ic{width:60px;height:60px;border-radius:50%;background:var(--card);border:0;display:grid;place-items:center}
.ic img{width:34px;height:34px;transition:.2s}
#fast img{opacity:.5}
.ic.on{background:#2a2108;box-shadow:0 0 0 2px var(--y),0 0 22px rgba(255,190,0,.45)}.ic.on img{opacity:1}
.chips{display:flex;gap:12px;margin-top:24px;overflow-x:auto;scrollbar-width:none;padding:2px}
.chip{flex:0 0 auto;min-width:68px;padding:15px 18px;border-radius:30px;background:var(--card);color:#9a9aa4;border:2px solid transparent;font-size:18px;font-weight:700}
.chip.p0{border-color:#7a2a2a}.chip.p1{border-color:#7a6418}.chip.p2{border-color:#1d6b35}
.chip.a{color:#fff;border-color:var(--y)}
.tabs{display:flex;background:var(--card);border-radius:28px;padding:6px;margin-top:30px}
.tabs button{flex:1;padding:15px;border:0;border-radius:23px;background:none;color:var(--mut);font-weight:700;font-size:16px}
.tabs button.a{background:var(--card2);color:#fff}
.panel{background:var(--card);border-radius:30px;margin-top:20px;padding:22px}
.panel h3{margin:0 0 20px;font-size:22px;color:#b5b5be;display:flex;gap:12px;align-items:center}
.panel h3 img{width:34px;height:34px}
.sub{display:flex;gap:8px;background:#101015;border-radius:26px;padding:6px;margin-bottom:20px}
.sub button{flex:1;padding:12px;border:0;border-radius:20px;background:none;color:var(--mut);font-weight:700;font-size:15px}
.sub button.a{background:var(--y);color:#2a1c00}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g{border-radius:22px;background:var(--card2);padding:12px;text-align:center;border:2px solid transparent}
.g.a{border-color:var(--y)}
.g .ga{height:128px;border-radius:16px}
.g .t{font-size:14px;color:#d6d6dd;margin-top:10px}
.g .p{margin:8px 0 2px;display:flex;gap:5px;justify-content:center;align-items:center;color:var(--y);font-weight:800}
.none{grid-column:1/-1;text-align:center;color:var(--mut);padding:28px 0}
.nav{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:rgba(32,32,38,.92);backdrop-filter:blur(12px);border-radius:44px;padding:12px 34px;display:flex;gap:42px;z-index:5;align-items:center}
.nav img{width:30px;height:30px;opacity:.6}.nav img.on{opacity:1}
.toast{position:fixed;top:24px;left:50%;transform:translate(-50%,-140px);background:#24242c;padding:14px 24px;border-radius:22px;font-weight:700;transition:.35s;z-index:20;box-shadow:0 10px 30px #0008;text-align:center;max-width:90%}
.toast.s{transform:translate(-50%,0)}
.sh{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10;display:none;align-items:flex-end;justify-content:center}
.sh.s{display:flex}
.sc{width:100%;max-width:480px;background:#14141a;border-radius:32px 32px 0 0;padding:28px 24px calc(28px + env(safe-area-inset-bottom,0px));animation:up .25s}
@keyframes up{from{transform:translateY(60px);opacity:0}}
.sc h2{margin:0 0 6px;font-size:24px}.sc p{color:var(--mut);margin:0 0 20px}
.fld{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:20px;padding:12px 18px;margin-bottom:12px;font-weight:600}
.fld input{width:90px;background:var(--card2);border:0;border-radius:14px;color:#fff;font-size:18px;font-weight:700;padding:10px;text-align:center;outline:0}
.big{width:100%;height:56px;border:0;border-radius:28px;background:linear-gradient(#ffd23a,#ffae00);font-size:18px;font-weight:800;color:#2a1c00;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px}
.big.alt{background:var(--card2);color:#fff}
.buy{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:14px}.buy .ga{width:170px;height:170px}.buy p{margin:0}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ffa800"/></linearGradient><symbol id="star" viewBox="0 0 24 24"><path fill="url(#sg)" d="M12 1.8l3 6.6 7.2.8-5.4 4.8 1.6 7.1L12 17.4l-6.4 3.7 1.6-7.1L1.8 9.2l7.2-.8z" stroke="#e08a00" stroke-width=".8" stroke-linejoin="round"/></symbol></defs></svg>
<div class="app">
<div class="top"><span class="pill">✕ &nbsp;Закрыть</span><button class="pill" id="topup"><svg class="st"><use href="#star"/></svg><b id="bal"></b><span class="plus">+</span></button></div>
<div class="gauge">
<svg viewBox="0 0 400 400">
<circle cx="200" cy="200" r="190" fill="none" stroke="#17171d" stroke-width="2"/>
<circle cx="200" cy="200" r="150" fill="none" stroke="#14141a" stroke-width="44"/>

</div>
<div class="cards"><div class="c" id="cm"></div><div class="c" id="cw"></div></div>
<div class="stake"><div class="l"><small>Ставка</small><b><svg class="st"><use href="#star"/></svg><span id="sa">0</span></b></div><input type="range" id="sr" min="0" max="100" value="0"><div class="sp" id="sp">0%</div></div>
<div class="hint" id="hint"></div>
<div class="row"><button class="ic" id="fast" title="Быстрая крутка"><img id="boltimg" alt=""></button><button class="go" id="go">Забустить</button><button class="ic" id="set"><img id="gearimg" alt=""></button></div>
<div class="chips" id="chips"></div>
<div class="tabs"><button id="t0">Мой инвентарь</button><button id="t1">Желаемые подарки</button></div>
<div class="panel" id="panel"></div>
</div>
<div class="nav"><img id="n1" alt=""><img id="n2" class="on" alt=""><img id="n3" alt=""></div>
<div class="toast" id="toast"></div>
<div class="sh" id="sh"><div class="sc" id="sc"></div></div>

let S={bal:10000,inv:[{u:1,i:idx('Кубок')},{u:2,i:idx('Сердце')},{u:3,i:idx('Liberty Figure')}],pcts:[35,55,75],uid:4};
try{const s=JSON.parse(localStorage.getItem('boost3'));if(s&&s.inv&&s.pcts)S=s}catch(e){}
const save=()=>{try{localStorage.setItem('boost3',JSON.stringify(S))}catch(e){}};
let mine=S.inv[0]||null,want=CAT[idx('Westside Sign')],pct=0,ci=-1,tab=1,sub=0,busy=false,rot=0,fast=false,keyM='',keyW='';
const gi=x=>CAT[x.i],star=(s=16)=>`<svg class="st" style="width:${s}px;height:${s}px"><use href="#star"/></svg>`;
const minePrice=()=>mine?gi(mine).p:0;
const maxValue=()=>Math.floor(want.p*CHMAX/EDGE);
const maxStake=()=>Math.max(0,Math.min(S.bal,maxValue()-minePrice()));
const stakeAmt=()=>Math.floor(maxStake()*pct/100);
const value=()=>minePrice()+stakeAmt();
const chance=()=>value()>0?Math.min(99,EDGE*value()/want.p):0;
function problem(){
 if(value()<=0)return 'Добавьте подарок или ставку';
 if(minePrice()>=want.p)return 'Нельзя апгрейдить на подарок такой же цены или дешевле';
 if(minePrice()>maxValue())return 'Шанс слишком высокий — выберите подарок подороже';
 return null}
const bgOf=g=>g.bg?`background-image:url(${g.bg})`:`background:linear-gradient(160deg,${g.c[0]},${g.c[1]})`;
const art=g=>`<div class="ga" style="${bgOf(g)}">${g.cut?`<img class="cut" src="${g.cut}" alt="">`:`<img class="gi" src="${A.ic[g.ic]}" alt="">`}${g.l?`<div class="lt" data-l="${g.l.join('|')}"></div>`:''}</div>`;
function mount(root){root.querySelectorAll('[data-l]').forEach(el=>{
 if(typeof lottie==='undefined')return;
 const paths=el.dataset.l.split('|');let k=0;
 const go=()=>{if(k>=paths.length)return;
  const a=lottie.loadAnimation({container:el,renderer:'svg',loop:true,autoplay:true,path:paths[k++],rendererSettings:{preserveAspectRatio:'xMidYMid slice'}});
  a.addEventListener('data_failed',()=>{a.destroy();go()});
  a.addEventListener('DOMLoaded',()=>{const c=el.parentNode.querySelector('.cut');if(c)c.style.display='none'});};
 try{go()}catch(e){}});}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('s');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('s'),2800)}
function sheet(h){$('sc').innerHTML=h;$('sh').classList.add('s')}
function closeSheet(){$('sh').classList.remove('s')}
$('sh').onclick=e=>{if(e.target.id==='sh')closeSheet()};
const card=g=>`<div class="badge">${star()}<span>${g.p}</span></div><div class="art">${art(g)}</div><div class="nm">${g.n}<small>${g.r}</small></div>`;
function renderTop(){
 const c=chance(),ms=maxStake(),pr=problem();
 $('pct').textContent=c.toFixed(2)+'%';
 const a=$('arc');a.setAttribute('stroke-dasharray',(c/100*CIRC)+' '+CIRC);a.setAttribute('transform','rotate('+(90-c*1.8)+' 200 200)');
 $('sa').textContent=stakeAmt();$('sp').textContent=pct+'%';$('bal').textContent=S.bal.toLocaleString('ru');
 $('sr').disabled=ms<=0;
 $('hint').className='hint'+(pr&&value()>0?' e':'');$('hint').textContent=pr&&value()>0?pr:'Макс. ставка: '+ms+' звёзд';
 const km=mine?mine.u:'-',kw=want.n;
 if(km!==keyM){keyM=km;$('cm').innerHTML=mine?card(gi(mine)):`<div class="empty"><button class="add" id="addb">＋ Добавить</button><p>Выберите подарок или поставьте звёзды</p></div>`;mount($('cm'));const b=$('addb');if(b)b.onclick=()=>{tab=0;sub=0;renderPanel();$('panel').scrollIntoView({behavior:'smooth'})}}
 if(kw!==keyW){keyW=kw;$('cw').innerHTML=card(want);mount($('cw'))}
 const ch=[['x2',EDGE/2],['x4',EDGE/4],['x100',EDGE/100],...S.pcts.map(p=>[p+'%',p])];
 $('chips').innerHTML=ch.map((x,i)=>`<button class="chip ${i>2?'p'+(i-3):''} ${i===ci?'a':''}" data-i="${i}">${x[0]}</button>`).join('');
 $('chips')._c=ch;
}
const gridItem=(g,act,i,sel)=>`<div class="g ${sel?'a':''}" data-act="${act}" data-i="${i}">${art(g)}<div class="t">${g.n}</div><div class="p">${star(15)}${g.p}</div></div>`;
function renderPanel(){
 $('t0').className=tab?'':'a';$('t1').className=tab?'a':'';
 let h='';
 if(tab)h=`<h3><img src="${A.ic.gift}" alt="">Выберите подарок</h3><div class="grid">${CAT.map((g,i)=>gridItem(g,'want',i,g===want)).join('')}</div>`;
 else{
  h=`<div class="sub"><button data-sub="0" class="${sub?'':'a'}">Мои подарки</button><button data-sub="1" class="${sub?'a':''}">Магазин</button></div>`;
  if(sub)h+=`<div class="grid">${CAT.map((g,i)=>gridItem(g,'shop',i,false)).join('')}</div>`;
  else h+=`<div class="grid">${S.inv.length?S.inv.map((x,i)=>gridItem(gi(x),'mine',i,mine&&mine.u===x.u)).join(''):'<div class="none">Инвентарь пуст — загляните в Магазин</div>'}</div>`;
 }
 $('panel').innerHTML=h;mount($('panel'));
}
function render(){renderTop();renderPanel()}
$('panel').onclick=e=>{
 const s=e.target.closest('[data-sub]');if(s){sub=+s.dataset.sub;renderPanel();return}
 const g=e.target.closest('[data-act]');if(!g||busy)return;const i=+g.dataset.i,act=g.dataset.act;
 if(act==='want'){want=CAT[i];ci=-1;render()}
 else if(act==='mine'){const x=S.inv[i];mine=(mine&&mine.u===x.u)?null:x;ci=-1;render()}
 else{const gg=CAT[i];sheet(`<div class="buy"><h2>Купить подарок</h2>${art(gg)}<b style="font-size:20px;margin-top:8px">${gg.n}</b><p>${gg.r}</p></div><button class="big" id="dobuy">Купить за ${star(20)} ${gg.p}</button><button class="big alt" onclick="closeSheet()">Отмена</button>`);mount($('sc'));
  $('dobuy').onclick=()=>{if(S.bal<gg.p){toast('Не хватает звёзд');return}S.bal-=gg.p;S.inv.push({u:S.uid++,i});save();closeSheet();toast('Куплено: '+gg.n+'. Подарок в инвентаре');render()}}
};
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b||busy)return;
 const v=value();if(v<=0){toast('Добавьте подарок или ставку');return}
 const i=+b.dataset.i,t=$('chips')._c[i][1];
 const cands=CAT.filter(g=>g.p>v&&v<=Math.floor(g.p*CHMAX/EDGE));
 if(!cands.length){toast('Нет подходящего подарка для этой суммы');return}
 want=cands.reduce((a,g)=>Math.abs(EDGE*v/g.p-t)<Math.abs(EDGE*v/a.p-t)?g:a);ci=i;render()};
$('sr').oninput=e=>{pct=+e.target.value;ci=-1;renderTop()};
$('topup').onclick=()=>{S.bal+=10000;save();toast('+10 000 звёзд (тестовый баланс)');renderTop()};
$('t0').onclick=()=>{tab=0;renderPanel()};$('t1').onclick=()=>{tab=1;renderPanel()};
$('fast').onclick=()=>{fast=!fast;$('fast').classList.toggle('on',fast);toast(fast?'Быстрая крутка включена':'Быстрая крутка выключена')};
$('set').onclick=()=>{
 sheet(`<h2>Настройки</h2><p>Свои значения для кнопок процента (1–${CHMAX}%). Кнопка подбирает подарок под нужный шанс.</p>${S.pcts.map((p,i)=>`<div class="fld"><span>Кнопка ${i+1}</span><input type="number" min="1" max="${CHMAX}" value="${p}" id="pc${i}"></div>`).join('')}<button class="big" id="sv">Сохранить</button><button class="big alt" id="tu">${star(20)} +10 000 тестовых звёзд</button>`);
 $('sv').onclick=()=>{S.pcts=[0,1,2].map(i=>Math.max(1,Math.min(CHMAX,Math.round(+$('pc'+i).value)||S.pcts[i])));ci=-1;save();closeSheet();toast('Сохранено');render()};
 $('tu').onclick=()=>{S.bal+=10000;save();renderTop();toast('+10 000 звёзд')};
};
$('go').onclick=()=>{
 if(busy)return;const pr=problem();if(pr){toast(pr);return}
 const c=chance(),p=Math.random()*100,win=p<c/2||p>100-c/2,T=fast?900:3200,st=stakeAmt(),m=mine,w=want;
 busy=true;$('go').disabled=true;
 rot+=360*(fast?2:4)+p*3.6-(rot%360);
 const g=$('ptr');g.style.transition='transform '+T+'ms cubic-bezier(.15,.7,.1,1)';g.style.transformOrigin='200px 200px';g.style.transform='rotate('+rot+'deg)';
 setTimeout(()=>{
  if(m)S.inv=S.inv.filter(x=>x.u!==m.u);
  S.bal-=st;
  if(win){S.inv.push({u:S.uid++,i:CAT.indexOf(w)});toast('Победа! '+w.n+' зачислен в инвентарь')}
  else toast('Проигрыш: списано '+[m?gi(m).n:'',st?st+' звёзд':''].filter(Boolean).join(' и '));
  mine=S.inv[0]||null;pct=0;$('sr').value=0;ci=-1;keyM='';save();busy=false;$('go').disabled=false;render();
 },T+150);
};
render();
</script></body></html>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎃 Halloween Case</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: #120a1f; color: #fff; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 20px; }
        .top-bar { background-color: #1f1235; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff7b00; box-shadow: 0 4px 15px rgba(255, 123, 0, 0.2); }
        .logo { font-size: 1.2rem; color: #ff7b00; text-shadow: 0 0 10px rgba(255, 123, 0, 0.5); }
        .balance-box { background: #000; padding: 8px 15px; border-radius: 20px; border: 1px solid #ff7b00; font-weight: bold; font-size: 1.1rem; color: #ffb700; }
        .container { padding: 20px; max-width: 600px; margin: 0 auto; width: 100%; }
        .section-title { color: #ff7b00; margin-bottom: 20px; font-size: 1.4rem; text-align: center; text-transform: uppercase; letter-spacing: 1px; }
        .cases-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .case-card { background: linear-gradient(145deg, #26163f, #1a0f2b); border: 1px solid #4a2c7a; border-radius: 15px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; justify-content: space-between; }
        .case-card:active { transform: scale(0.95); border-color: #ff7b00; box-shadow: 0 0 15px rgba(255, 123, 0, 0.4); }
        .case-img { width: 100px; height: 100px; object-fit: contain; margin-bottom: 10px; filter: drop-shadow(0 0 10px rgba(255,123,0,0.3)); }
        .case-card h3 { font-size: 0.95rem; margin-bottom: 8px; color: #e0d0f0; line-height: 1.2; }
        .case-card p { color: #ffb700; font-weight: bold; font-size: 1rem; background: rgba(0,0,0,0.4); padding: 4px 12px; border-radius: 10px; }
    </style>
</head>
<body>
    <header class="top-bar">
        <h1 class="logo">🎃 Halloween Case</h1>
        <div class="balance-box"><span id="balance-amount">0</span> 🎃</div>
    </header>

    <main class="container">
        <h2 class="section-title">Кейсы</h2>
        <div class="cases-grid">
            <!-- Кейс 1 -->
            <div class="case-card" onclick="openCase('hell', 300)">
                <img src="https://f.2fools.app/tgs/sticker_set/f70510f3.gif" class="case-img" alt="Адский кейс">
                <h3>Адский кейс</h3>
                <p>300 🎃</p>
            </div>

            <!-- Кейс 2 -->
            <div class="case-card" onclick="openCase('coffin', 250)">
                <img src="https://f.2fools.app/tgs/sticker_set/debf8fd6.gif" class="case-img" alt="Гробный кейс">
                <h3>Гробный кейс</h3>
                <p>250 🎃</p>
            </div>

            <!-- Кейс 3 -->
            <div class="case-card" onclick="openCase('nft', 1000)">
                <img src="https://f.2fools.app/tgs/sticker_set/1a148ae3.gif" class="case-img" alt="NFT юзернеймы">
                <h3>Кейс NFT юзернеймы</h3>
                <p>1000 🎃</p>
            </div>

            <!-- Кейс 4 -->
            <div class="case-card" onclick="openCase('anon', 1500)">
                <img src="https://f.2fools.app/tgs/sticker_set/baa518d9.gif" class="case-img" alt="Анонимные номера">
                <h3>Кейс анонимные номера</h3>
                <p>1500 🎃</p>
            </div>
        </div>
    </main>

    <script>
        const SUPABASE_URL = "https://ptcofqwsvyytcnoerazu.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_CL2wAd6YW9tj5fIq4r9b4A_iVeZtnBx";

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let userId = (tg.initDataUnsafe?.user?.id) ? tg.initDataUnsafe.user.id : 1780243317;

        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function loadBalance() {
            if (!userId) return;
            try {
                const { data, error } = await db.from('users').select('balance').eq('user_id', userId).single();
                if (data) document.getElementById('balance-amount').innerText = data.balance;
            } catch (e) { console.error(e); }
        }
        loadBalance();

        function openCase(caseId, price) {
            // Пока заглушка. Позже тут будет анимация.
            tg.showAlert(`Открываем ${caseId} за ${price} 🎃`);
        }
    </script>
</body>
</html>

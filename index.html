<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gift Boost</title>
    <style>
        /* ТУТ ВСЕ СТИЛИ КАК В ПРЕДЫДУЩЕМ КОДЕ, НО С ИЗМЕНЕННЫМ БЛОКОМ ПОЛОСЫ */
        /* ... копируй стили из предыдущего ответа, но замени блок .progress-wrapper и .progress-circle на: */
        
        .progress-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
            transform: rotate(90deg); /* Поворот 90 = старт снизу */
        }
        .progress-svg {
            width: 100%;
            height: 100%;
        }
        .progress-circle {
            stroke: #ff8c00;
            stroke-width: 16;
            fill: none;
            stroke-linecap: round;
            transition: stroke-dasharray 0.3s;
        }
    </style>
</head>
<body>
    <!-- ... весь HTML как в предыдущем ответе, но вместо div.progress-circle ставим: -->
    
    <svg class="progress-svg" viewBox="0 0 260 260">
        <circle class="progress-circle" id="progressCircle" cx="130" cy="130" r="122" />
    </svg>
    
    <!-- ... -->
    
    <script>
        // ... функции ...
        function updateUI() {
            document.getElementById('balanceDisplay').innerText = balance.toFixed(2);
            document.getElementById('chanceDisplay').innerText = chance.toFixed(2) + "%";
            
            let visualProgress = chance < 5 ? 5 : chance;
            const circle = document.getElementById('progressCircle');
            
            // Радиус 122. Длина окружности = 2 * PI * 122 = 766.5
            const circumference = 2 * Math.PI * 122;
            // Сколько нужно закрасить
            const dashLength = (visualProgress / 100) * circumference;
            
            // Устанавливаем штрих
            circle.style.strokeDasharray = `${dashLength} ${circumference}`;
            
            // Убираем сдвиг, чтобы начало было ровно с 0 (после поворота на 90 град)
            circle.style.strokeDashoffset = '0';
        }
        // ... остальной код ...
    </script>
</body>
</html>

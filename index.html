<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gift Boost</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: #000; color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* --- ХЕДЕР --- */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; z-index: 10; }
        .balance-pill { display: flex; align-items: center; border: 1px solid #ffd700; padding: 4px 10px; border-radius: 15px; gap: 5px; color: #ffd700; font-weight: 600; font-size: 13px; }
        .btn-topup { background: #ffd700; color: #000; border: none; padding: 6px 12px; border-radius: 15px; font-weight: 700; font-size: 12px; }

        /* --- БАННЕР --- */
        .banner { margin: 0 15px 10px; background: #111; border-radius: 10px; padding: 8px 12px; display: flex; align-items: center; position: relative; }
        .banner-text { font-size: 12px; font-weight: 600; }
        .banner-icon { width: 24px; height: 24px; background: #ff4500; border-radius: 6px; margin-right: 10px; }
        .banner-close { position: absolute; right: 12px; color: #555; font-size: 12px; }

        /* --- БАРАБАН --- */
        .wheel-zone { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; margin-top: 10px; }
        
        .wheel-outer { position: relative; width: 240px; height: 240px; display: flex; justify-content: center; align-items: center; }
        
        /* Внешнее кольцо */
        .wheel-bg { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 16px solid #111; background: #050505; box-shadow: inset 0 0 20px rgba(0,0,0,1); }
        
        /* Оранжевая заливка (прогресс) */
        .wheel-progress { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 16px solid transparent; border-bottom-color: #ff8c00; border-right-color: #ff8c00; transform: rotate(-45deg); opacity: 0; transition: opacity 0.3s; }
        .wheel-progress.active { opacity: 1; }

        /* Внутренний круг */
        .wheel-inner { position: absolute; width: 160px; height: 160px; border-radius: 50%; border: 10px solid #080808; background: #000; z-index: 2; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; }
        
        .percent-num { font-size: 32px; font-weight: 700; letter-spacing: -1px; transition: opacity 0.3s; }
        .percent-lbl { font-size: 11px; color: #666; margin-top: 2px; transition: opacity 0.3s; }

        /* Анимация результата */
        .result-container { position: absolute; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100%; opacity: 0; transition: opacity 0.5s ease; z-index: 3; }
        .result-container.show { opacity: 1; }
        
        .result-icon { width: 50px; height: 50px; margin-bottom: 5px; }
        .result-text { font-size: 18px; font-weight: 700; }
        .result-text.win { color: #4cd964; }
        .result-text.lose { color: #666; font-size: 14px; font-weight: 500; }
        
        .result-gift-info { text-align: center; margin-top: 2px; }
        .result-gift-name { font-size: 11px; font-weight: 600; color: #fff; }
        .result-gift-id { font-size: 9px; color: #888; }

        /* Стрелка */
        .arrow-container { position: absolute; width: 240px; height: 240px; pointer-events: none; z-index: 5; transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1); }
        .arrow-shape { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 14px; height: 24px; background: #ffd700; clip-path: polygon(50% 0%, 100% 40%, 70% 40%, 70% 100%, 30% 100%, 30% 40%, 0% 40%); filter: drop-shadow(0 0 5px rgba(255, 215, 0, 0.8)); }

        .labels { display: flex; justify-content: space-between; width: 260px; font-size: 10px; color: #444; font-weight: 600; margin-top: 5px; }

        /* --- КАРТОЧКИ ПОДАРКОВ --- */
        .gift-cards { display: flex; justify-content: center; gap: 12px; margin-top: 15px; z-index: 10; }
        .gift-card { width: 130px; background: #151515; border: 1px solid #222; border-radius: 16px; padding: 8px; display: flex; flex-direction: column; align-items: center; position: relative; cursor: pointer; transition: 0.2s; }
        .gift-card.active { border-color: #ffd700; background: rgba(255, 215, 0, 0.05); }
        .gift-price { position: absolute; top: 6px; right: 6px; background: #222; color: #fff; padding: 2px 6px; border-radius: 8px; font-size: 10px; font-weight: 600; }
        .gift-price.blue { background: #007bff; }
        .gift-img { width: 50px; height: 50px; object-fit: contain; margin: 15px 0 5px; }
        .gift-name { font-size: 12px; font-weight: 600; text-align: center; }
        .gift-sub { font-size: 10px; color: #666; }

        /* --- УПРАВЛЕНИЕ --- */
        .controls { padding: 15px; z-index: 10; }
        .action-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .btn-icon { width: 40px; height: 40px; background: #111; border: 1px solid #222; border-radius: 10px; display: flex; justify-content: center; align-items: center; color: #ffd700; }
        .btn-boost { flex-grow: 1; background: #ffd700; color: #000; border: none; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; }
        
        .chances-grid { display: flex; gap: 5px; }
        .chance-btn { flex: 1; background: #111; border: 1px solid #222; color: #666; padding: 8px 0; border-radius: 8px; font-size: 12px; font-weight: 600; text-align: center; cursor: pointer; }
        .chance-btn.active { border-color: #ffd700; color: #ffd700; background: rgba(255, 215, 0, 0.05); }
        .chance-btn.red { border-color: #ff4444; color: #ff4444; }
        .chance-btn.yellow { border-color: #ffd700; color: #ffd700; }
        .chance-btn.green { border-color: #44ff44; color: #44ff44; }

        /* --- ВКЛАДКИ --- */
        .tabs-container { padding: 0 15px; margin-bottom: 10px; }
        .tabs { display: flex; background: #111; border-radius: 10px; padding: 4px; }
        .tab { flex: 1; text-align: center; padding: 8px; font-size: 12px; font-weight: 600; color: #666; border-radius: 6px; cursor: pointer; }
        .tab.active { background: #222; color: #fff; }

        /* --- ПОИСК --- */
        .search-area { padding: 0 15px 15px; }
        .search-box { background: #111; border-radius: 10px; padding: 10px; }
        .search-title { font-size: 12px; color: #fff; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
        .search-title .icon { color: #ffd700; }
        .search-inputs { display: flex; gap: 6px; }
        .search-input { flex: 1; background: #050505; border: 1px solid #222; border-radius: 6px; padding: 8px; color: #fff; font-size: 12px; outline: none; }
        .search-btn { width: 35px; background: #222; border: none; border-radius: 6px; color: #888; display: flex; justify-content: center; align-items: center; }

        /* --- СПИСОК ПОДАРКОВ --- */
        .gift-list { padding: 0 15px 15px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; max-height: 200px; }
        .gift-list-item { background: #151515; border: 1px solid #222; border-radius: 10px; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .gift-list-item .name { font-size: 13px; font-weight: 600; }
        .gift-list-item .price { font-size: 12px; color: #ffd700; font-weight: 600; }

        /* --- ПОДВАЛ --- */
        .footer-nav { display: flex; justify-content: space-around; background: #0a0a0a; padding: 12px 0; border-top: 1px solid #111; }
        .nav-item { color: #444; cursor: pointer; }
        .nav-item.active { color: #ffd700; }
        .nav-icon { width: 22px; height: 22px; fill: currentColor; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ХЕДЕР -->
    <div class="header">
        <div class="balance-pill"><span>⭐</span> <span id="balanceDisplay">1000.00</span></div>
        <button class="btn-topup">+ Пополнить</button>
    </div>

    <!-- БАННЕР -->
    <div class="banner">
        <div class="banner-icon"></div>
        <div class="banner-text">Бесплатный NFT Кейс</div>
        <div class="banner-close">✕</div>
    </div>

    <!-- БАРАБАН -->
    <div class="wheel-zone">
        <div class="labels"><span>50%</span><span>100%</span><span>50%</span></div>
        <div class="wheel-outer">
            <div class="wheel-bg"></div>
            <div class="wheel-progress" id="wheelProgress"></div>
            
            <!-- Внутренний круг с процентами -->
            <div class="wheel-inner" id="wheelInner">
                <div class="percent-num" id="chanceDisplay">25.00%</div>
                <div class="percent-lbl" id="chanceLabel">Средний шанс</div>

                <!-- Блок результата (скрыт по умолчанию) -->
                <div class="result-container" id="resultContainer">
                    <svg class="result-icon" id="resultIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></svg>
                    <div class="result-text" id="resultText"></div>
                    <div class="result-gift-info" id="resultGiftInfo">
                        <div class="result-gift-name" id="resultGiftName"></div>
                        <div class="result-gift-id" id="resultGiftId"></div>
                    </div>
                </div>
            </div>
            
            <div class="arrow-container" id="arrowContainer">
                <div class="arrow-shape"></div>
            </div>
        </div>
        <div class="labels"><span>0%</span></div>
    </div>

    <!-- КАРТОЧКИ ПОДАРКОВ -->
    <div class="gift-cards">
        <div class="gift-card active" onclick="selectGift(this, 100, 'Кубок', '#12345')">
            <div class="gift-price">⭐ 100</div>
            <img src="https://cdn-icons-png.flaticon.com/512/3113/3113549.png" class="gift-img" alt="Кубок">
            <div class="gift-name">Кубок</div>
            <div class="gift-sub">Обычный</div>
        </div>
        <div class="gift-card" onclick="selectGift(this, 3.19, 'Xmas Stocking', '#200912')">
            <div class="gift-price blue">🌍 3.19</div>
            <img src="https://cdn-icons-png.flaticon.com/512/4213/4213230.png" class="gift-img" alt="Подарок">
            <div class="gift-name">Xmas Stocking</div>
            <div class="gift-sub">#200912</div>
        </div>
    </div>

    <!-- УПРАВЛЕНИЕ -->
    <div class="controls">
        <div class="action-row">
            <div class="btn-icon">⚡</div>
            <button class="btn-boost" id="spinBtn" onclick="spin()">Забустить</button>
            <div class="btn-icon" onclick="openSettings()">⚙️</div>
        </div>
        <div class="chances-grid">
            <div class="chance-btn" onclick="setChance(50, this)">x2</div>
            <div class="chance-btn active" onclick="setChance(25, this)">x4</div>
            <div class="chance-btn" onclick="setChance(1, this)">x100</div>
            <div class="chance-btn red" onclick="setChance(35, this)">35%</div>
            <div class="chance-btn yellow" onclick="setChance(55, this)">55%</div>
            <div class="chance-btn green" onclick="setChance(75, this)">75%</div>
        </div>
    </div>

    <!-- ВКЛАДКИ -->
    <div class="tabs-container">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('inv', this)">Мой инвентарь</div>
            <div class="tab" onclick="switchTab('wish', this)">Желаемые подарки</div>
        </div>
    </div>

    <!-- ИНВЕНТАРЬ -->
    <div id="inv-section">
        <div class="search-area">
            <div class="search-box">
                <div class="search-title"><span class="icon">🎁</span> Выберите подарок</div>
                <div class="search-inputs">
                    <input type="text" class="search-input" placeholder="Цена От">
                    <input type="text" class="search-input" placeholder="Цена До">
                    <button class="search-btn">🔍</button>
                </div>
            </div>
        </div>
        <div class="gift-list" style="max-height: 150px;">
            <div class="gift-list-item">
                <div class="name">🎁 Redo</div>
                <div class="price">100,000 ⭐</div>
                <button onclick="addToWish('Redo', 100000)" style="background:#222;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:11px;">Добавить</button>
            </div>
            <div class="gift-list-item">
                <div class="name">🎄 Xmas Stocking</div>
                <div class="price">3.19 🌍</div>
                <button onclick="addToWish('Xmas Stocking', 3.19)" style="background:#222;color:#fff;border:none;padding:5px 10px;border-radius:6px;font-size:11px;">Добавить</button>
            </div>
        </div>
    </div>

    <!-- ЖЕЛАЕМЫЕ ПОДАРКИ -->
    <div id="wish-section" class="hidden">
        <div class="gift-list" id="wish-list">
            <div class="gift-list-item">
                <div class="name">🎁 Redo</div>
                <div class="price">100,000 ⭐</div>
            </div>
            <div class="gift-list-item">
                <div class="name">🎄 Xmas Stocking</div>
                <div class="price">3.19 🌍</div>
            </div>
        </div>
    </div>

    <!-- ПОДВАЛ -->
    <div class="footer-nav">
        <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 6h-2.18c.11-.31.18-.65.18-1a2.996 2.996 0 0 0-5.5-1.65l-.5.67-.5-.68C10.96 2.54 10.05 2 9 2 7.34 2 6 3.34 6 5c0 .35.07.69.18 1H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-5-2c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9 4c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm11 15H4v-2h16v2zm0-5H4V8h5.08L7 10.83 8.62 12 11 8.76l1-1.36 1 1.36L15.38 12 17 10.83 14.92 8H20v6z"/></svg></div>
        <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-4v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/></svg></div>
        <div class="nav-item active"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M4 10h16v11H4zM4 4h16v6H4z"/></svg></div>
        <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg></div>
        <div class="nav-item"><svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg></div>
    </div>

    <!-- МОДАЛКА -->
    <div id="settingsModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:100; justify-content:center; align-items:center;">
        <div style="background:#111; padding:20px; border-radius:12px; width:80%; text-align:center; border:1px solid #222;">
            <h3 style="margin-bottom:15px;">Свой шанс</h3>
            <input type="number" id="customChanceInput" style="width:100%; padding:10px; margin-bottom:15px; background:#050505; border:1px solid #333; color:#fff; text-align:center; border-radius:8px;">
            <button onclick="applyCustomChance()" style="width:100%; padding:12px; background:#ffd700; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">Применить</button>
            <button onclick="document.getElementById('settingsModal').style.display='none'" style="width:100%; padding:10px; background:transparent; border:none; color:#888; margin-top:10px; cursor:pointer;">Отмена</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.setHeaderColor('#000000'); }

        let balance = 1000.00;
        let chance = 25;
        let rotation = 0;
        let isSpinning = false;
        let betAmount = 100;
        let currentGiftName = 'Кубок';
        let currentGiftId = '#12345';

        function updateUI() {
            document.getElementById('balanceDisplay').innerText = balance.toFixed(2);
            document.getElementById('chanceDisplay').innerText = chance.toFixed(2) + "%";
        }

        function setChance(val, el) {
            if (isSpinning) return;
            chance = val;
            document.querySelectorAll('.chance-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            updateUI();
        }

        function selectGift(el, price, name, id) {
            if (isSpinning) return;
            document.querySelectorAll('.gift-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            betAmount = price;
            currentGiftName = name;
            currentGiftId = id;
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            
            if (tab === 'inv') {
                document.getElementById('inv-section').classList.remove('hidden');
                document.getElementById('wish-section').classList.add('hidden');
            } else {
                document.getElementById('inv-section').classList.add('hidden');
                document.getElementById('wish-section').classList.remove('hidden');
            }
        }

        function addToWish(name, price) {
            const list = document.getElementById('wish-list');
            const item = document.createElement('div');
            item.className = 'gift-list-item';
            item.innerHTML = `
                <div class="name">🎁 ${name}</div>
                <div class="price">${price} ${name.includes('Xmas') ? '🌍' : '⭐'}</div>
            `;
            list.appendChild(item);
            if(tg) tg.showAlert(`Подарок ${name} добавлен в желаемые!`);
        }

        function openSettings() {
            if (isSpinning) return;
            document.getElementById('settingsModal').style.display = 'flex';
            document.getElementById('customChanceInput').value = chance;
        }

        function applyCustomChance() {
            let val = parseFloat(document.getElementById('customChanceInput').value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > 99) val = 99;
            chance = val;
            document.querySelectorAll('.chance-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('settingsModal').style.display = 'none';
            updateUI();
        }

        function spin() {
            if (isSpinning) return;
            if (balance < betAmount) {
                if (tg) tg.showAlert("Недостаточно средств!");
                return;
            }

            isSpinning = true;
            const btn = document.getElementById('spinBtn');
            const arrow = document.getElementById('arrowContainer');
            const progress = document.getElementById('wheelProgress');
            const percentNum = document.getElementById('chanceDisplay');
            const percentLbl = document.getElementById('chanceLabel');
            const resultContainer = document.getElementById('resultContainer');
            const resultIcon = document.getElementById('resultIcon');
            const resultText = document.getElementById('resultText');
            const resultGiftInfo = document.getElementById('resultGiftInfo');
            const resultGiftName = document.getElementById('resultGiftName');
            const resultGiftId = document.getElementById('resultGiftId');

            resultContainer.classList.remove('show');
            percentNum.style.opacity = '1';
            percentLbl.style.opacity = '1';

            btn.innerText = "Крутим...";
            btn.disabled = true;
            progress.classList.add('active');

            balance -= betAmount;
            updateUI();

            const isWin = (Math.random() * 100) <= chance;

            let targetDeg = isWin ? 0 : 180;
            targetDeg += (Math.random() * 40 - 20);

            let currentMod = rotation % 360;
            let diff = targetDeg - currentMod;
            if (diff < 0) diff += 360;

            rotation += (5 * 360) + diff;
            arrow.style.transform = `rotate(${rotation}deg)`;

            setTimeout(() => {
                progress.classList.remove('active');
                arrow.style.transition = 'none';
                rotation = rotation % 360;
                arrow.style.transform = `rotate(${rotation}deg)`;
                setTimeout(() => { arrow.style.transition = 'transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)'; }, 50);

                percentNum.style.opacity = '0';
                percentLbl.style.opacity = '0';

                if (isWin) {
                    resultIcon.innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';
                    resultIcon.style.color = '#4cd964';
                    resultText.innerText = 'Удача!';
                    resultText.className = 'result-text win';
                    resultGiftInfo.style.display = 'block';
                    resultGiftName.innerText = currentGiftName;
                    resultGiftId.innerText = currentGiftId;
                    
                    let multiplier = 100 / chance;
                    let winAmount = Math.floor(betAmount * multiplier);
                    balance += winAmount;
                    
                    if (tg) tg.showAlert(`🎉 ВЫИГРАЛ!\n+${winAmount} ⭐`);
                } else {
                    resultIcon.innerHTML = '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>';
                    resultIcon.style.color = '#666';
                    resultText.innerText = 'Неудача';
                    resultText.className = 'result-text lose';
                    resultGiftInfo.style.display = 'none';
                    
                    if (tg) tg.showAlert(`💀 ПРОИГРАЛ!\n-${betAmount} ⭐`);
                }

                resultContainer.classList.add('show');
                updateUI();

                setTimeout(() => {
                    resultContainer.classList.remove('show');
                    percentNum.style.opacity = '1';
                    percentLbl.style.opacity = '1';
                    
                    isSpinning = false;
                    btn.disabled = false;
                    btn.innerText = "Забустить";
                }, 3000);

            }, 4100);
        }

        updateUI();
    </script>
</body>
</html>

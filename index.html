<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🎃 Halloween Case</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #120a1f;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .top-bar {
            background-color: #1f1235;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff7b00;
            box-shadow: 0 4px 15px rgba(255, 123, 0, 0.2);
        }
        .logo {
            font-size: 1.2rem;
            color: #ff7b00;
            text-shadow: 0 0 10px rgba(255, 123, 0, 0.5);
        }
        .balance-box {
            background: #000;
            padding: 8px 15px;
            border-radius: 20px;
            border: 1px solid #ff7b00;
            font-weight: bold;
            font-size: 1.1rem;
            color: #ffb700;
        }
        .container {
            padding: 20px;
            max-width: 600px;
            margin: 0 auto;
            width: 100%;
        }
        .section-title {
            color: #ff7b00;
            margin-bottom: 15px;
            font-size: 1.4rem;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .cases-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }
        .case-card {
            background: linear-gradient(145deg, #26163f, #1a0f2b);
            border: 1px solid #4a2c7a;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .case-card:active {
            transform: scale(0.95);
            border-color: #ff7b00;
            box-shadow: 0 0 15px rgba(255, 123, 0, 0.4);
        }
        .case-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 10px rgba(255,123,0,0.5));
        }
        .case-card h3 {
            font-size: 1rem;
            margin-bottom: 5px;
            color: #e0d0f0;
        }
        .case-card p {
            color: #ffb700;
            font-weight: bold;
            font-size: 0.9rem;
        }
        .upgrader-panel {
            background: #1f1235;
            border-radius: 15px;
            padding: 20px;
            border: 1px solid #4a2c7a;
        }
        .upgrader-slots {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .slot {
            width: 45%;
            aspect-ratio: 1;
            background: #120a1f;
            border: 2px dashed #4a2c7a;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: 0.3s;
        }
        .slot:hover {
            border-color: #ff7b00;
        }
        .slot .plus {
            font-size: 2rem;
            color: #4a2c7a;
        }
        .slot p {
            font-size: 0.9rem;
            color: #888;
            margin-top: 5px;
        }
        .upgrader-arrow {
            font-size: 2rem;
            color: #ff7b00;
        }
        .upgrader-chance {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            color: #ffb700;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 183, 0, 0.5);
        }
        .main-btn {
            background: linear-gradient(135deg, #ff7b00, #ff4500);
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4);
            transition: 0.2s;
        }
        .main-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <header class="top-bar">
        <h1 class="logo">🎃 Halloween Case</h1>
        <div class="balance-box"><span id="balance-amount">0</span> 🎃</div>
    </header>

    <main class="container">
        <h2 class="section-title">Кейсы</h2>
        <div class="cases-grid">
            <div class="case-card" onclick="openCase('hell', 100)">
                <div class="case-icon">📦</div>
                <h3>Адский кейс</h3>
                <p>Цена: 100 🎃</p>
            </div>
            <div class="case-card" onclick="openCase('vip', 500)">
                <div class="case-icon">💎</div>
                <h3>Кейс Тыквы</h3>
                <p>Цена: 500 🎃</p>
            </div>
        </div>

        <h2 class="section-title">Апгрейдер</h2>
        <div class="upgrader-panel">
            <div class="upgrader-slots">
                <div class="slot" onclick="alert('Выбор предмета')">
                    <span class="plus">+</span><p>Выбери</p>
                </div>
                <div class="upgrader-arrow">➜</div>
                <div class="slot" onclick="alert('Выбор цели')">
                    <span class="plus">+</span><p>Цель</p>
                </div>
            </div>
            <div class="upgrader-chance"><span>0%</span></div>
            <button class="main-btn" onclick="alert('Апгрейд')">Апгрейд</button>
        </div>
    </main>

    <script>
        // Твои данные из Supabase
        const SUPABASE_URL = "https://ptcofqwsvyytcnoerazu.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_CL2wAd6YW9tj5fIq4r9b4A_iVeZtnBx";

        // Инициализация Telegram
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let userId = null;
        
        // Получаем ID из Телеграма
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            userId = tg.initDataUnsafe.user.id;
        } else {
            // Если открыто в браузере (для теста), берем твой ID
            userId = 1780243317; 
        }

        // Подключаемся к базе
        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Функция загрузки баланса
        async function loadBalance() {
            if (!userId) return;
            
            try {
                const { data, error } = await db
                    .from('users')
                    .select('balance')
                    .eq('user_id', userId)
                    .single();

                if (data) {
                    document.getElementById('balance-amount').innerText = data.balance;
                } else {
                    console.log("Юзер не найден в базе");
                }
            } catch (e) {
                console.error("Ошибка загрузки:", e);
            }
        }

        // Загружаем баланс при открытии
        loadBalance();

        // Логика кейсов
        function openCase(caseId, price) {
            if (tg.showAlert) {
                tg.showAlert(`Ты пытаешься открыть ${caseId} за ${price} 🎃`);
            } else {
                alert(`Ты пытаешься открыть ${caseId} за ${price} 🎃`);
            }
        }
    </script>
</body>
</html>

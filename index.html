<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Halloween Case</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0a0a0a; background-image: radial-gradient(circle at top right, #1f1235 0%, #0a0a0a 50%); color: #fff; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 20px; overflow-x: hidden; }
        
        .top-bar { background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(10px); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2b1b45; position: sticky; top: 0; z-index: 10; }
        .logo { font-size: 1.1rem; font-weight: 800; color: #fff; text-shadow: 0 0 15px #ff7b00; letter-spacing: 1px; }
        .balance-box { background: #151515; padding: 8px 16px; border-radius: 8px; border: 1px solid #333; font-weight: 800; font-size: 1rem; color: #fff; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        
        .container { padding: 20px; max-width: 600px; margin: 0 auto; width: 100%; }
        .nav-tabs { display: flex; gap: 15px; margin-bottom: 30px; }
        .nav-tab { flex: 1; text-align: center; padding: 12px; background: #151515; border: 1px solid #222; border-radius: 12px; color: #777; font-weight: 800; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.3s; }
        .nav-tab.active { background: #1a1a1a; color: #fff; border-color: #ff7b00; box-shadow: inset 0 0 15px rgba(255,123,0,0.1), 0 0 15px rgba(255,123,0,0.2); }
        
        .section-title { color: #fff; margin-bottom: 20px; font-size: 1.1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; border-left: 3px solid #ff7b00; padding-left: 10px; }
        
        /* Кейсы */
        .cases-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .case-card { background: #111; border: 1px solid #222; border-radius: 16px; padding: 20px 15px; text-align: center; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; }
        .case-card:active { transform: scale(0.96); border-color: #ff7b00; }
        .case-img { width: 110px; height: 110px; object-fit: contain; margin-bottom: 15px; filter: drop-shadow(0 0 15px rgba(255,123,0,0.4)); }
        .case-card h3 { font-size: 0.85rem; font-weight: 600; margin-bottom: 12px; color: #ccc; }
        .case-card p { color: #fff; font-weight: 800; font-size: 1rem; background: #1a1a1a; padding: 6px 14px; border-radius: 8px; border: 1px solid #333; }

        /* Инвентарь */
        .inventory-list { display: flex; flex-direction: column; gap: 10px; }
        .inventory-item { background: #111; padding: 15px; border-radius: 12px; border: 1px solid #222; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        .inv-info { flex: 1; min-width: 120px; }
        .inv-info span { font-weight: 800; color: #fff; display: block; margin-bottom: 4px; word-break: break-all; }
        .inv-info small { color: #ff7b00; font-weight: 600; font-size: 0.8rem; }
        .inv-actions { display: flex; gap: 5px; }
        .btn-sell { background: #28a745; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 800; font-size: 0.75rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .btn-withdraw { background: #ff4500; color: #fff; border: none; padding: 8px 12px; border-radius: 8px; font-weight: 800; font-size: 0.75rem; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .btn-sell:active, .btn-withdraw:active { transform: scale(0.95); }

        .empty-text { text-align: center; color: #555; margin-top: 40px; font-weight: 600; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Модалки */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; backdrop-filter: blur(10px); }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #0f0f0f; border: 1px solid #333; border-radius: 24px; padding: 25px 20px; width: 100%; max-width: 400px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 40px rgba(255,123,0,0.15); }
        
        .modal-title { color: #fff; margin-bottom: 20px; text-align: center; font-size: 1.2rem; font-weight: 800; text-transform: uppercase; }
        
        /* Окно подтверждения */
        .confirm-text { text-align: center; color: #aaa; margin-bottom: 20px; font-size: 0.9rem; }
        .modal-actions { display: flex; gap: 10px; }
        .btn-yes { background: #28a745; color: #fff; border: none; padding: 15px; border-radius: 12px; font-weight: 800; cursor: pointer; flex: 1; text-transform: uppercase; font-size: 0.9rem; }
        .btn-no { background: transparent; color: #fff; border: 1px solid #333; padding: 15px; border-radius: 12px; font-weight: 800; cursor: pointer; flex: 1; text-transform: uppercase; font-size: 0.9rem; }

        /* === АНИМАЦИЯ РУЛЕТКИ (КЕЙС) === */
        .roulette-container { overflow: hidden; width: 100%; height: 120px; position: relative; border-top: 1px solid #333; border-bottom: 1px solid #333; margin-bottom: 20px; background: #151515; }
        .roulette-strip { display: flex; height: 100%; width: max-content; align-items: center; transition: transform 4s cubic-bezier(0.1, 0.7, 0.1, 1); }
        .roulette-item { width: 100px; height: 100px; margin: 0 10px; border-radius: 10px; background: #1a1a1a; border: 1px solid #333; display: flex; justify-content: center; align-items: center; text-align: center; font-size: 0.8rem; font-weight: 600; padding: 10px; flex-shrink: 0; }
        
        .roulette-pointer { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 2px; height: 100%; background: #ff7b00; box-shadow: 0 0 10px #ff7b00; z-index: 2; }
        .roulette-pointer::before { content: ''; position: absolute; top: -10px; left: -5px; border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 10px solid #ff7b00; }
    </style>
</head>
<body>
    <header class="top-bar">
        <h1 class="logo">HALLOWEEN CASE</h1>
        <div class="balance-box"><span id="balance-amount">0</span> 🎃</div>
    </header>

    <main class="container">
        <div class="nav-tabs">
            <div class="nav-tab active" onclick="switchTab('cases', this)">Кейсы</div>
            <div class="nav-tab" onclick="switchTab('inventory', this)">Инвентарь</div>
        </div>

        <!-- ВКЛАДКА КЕЙСОВ -->
        <div id="tab-cases" class="tab-content active">
            <h2 class="section-title">Доступные кейсы</h2>
            <div class="cases-grid">
                <div class="case-card" onclick="openCase('hell', 300)">
                    <img src="https://f.2fools.app/tgs/sticker_set/f70510f3.gif" class="case-img">
                    <h3>АДСКИЙ КЕЙС</h3>
                    <p>300 🎃</p>
                </div>
                <div class="case-card" onclick="openCase('coffin', 250)">
                    <img src="https://f.2fools.app/tgs/sticker_set/debf8fd6.gif" class="case-img">
                    <h3>ГРОБНЫЙ КЕЙС</h3>
                    <p>250 🎃</p>
                </div>
                <div class="case-card" onclick="openCase('nft', 1000)">
                    <img src="https://f.2fools.app/tgs/sticker_set/1a148ae3.gif" class="case-img">
                    <h3>NFT ЮЗЕРНЕЙМЫ</h3>
                    <p>1000 🎃</p>
                </div>
                <div class="case-card" onclick="openCase('anon', 1500)">
                    <img src="https://f.2fools.app/tgs/sticker_set/baa518d9.gif" class="case-img">
                    <h3>АНОНИМНЫЕ НОМЕРА</h3>
                    <p>1500 🎃</p>
                </div>
            </div>
        </div>

        <!-- ВКЛАДКА ИНВЕНТАРЯ -->
        <div id="tab-inventory" class="tab-content">
            <h2 class="section-title">Твой инвентарь</h2>
            <div id="inventory-list" class="inventory-list">
                <p class="empty-text">Загрузка...</p>
            </div>
        </div>
    </main>

    <!-- МОДАЛКА РУЛЕТКИ -->
    <div class="modal-overlay" id="roulette-modal">
        <div class="modal-content" style="max-width: 500px; padding: 20px;">
            <h3 class="modal-title" id="roulette-title">Открываем...</h3>
            <div class="roulette-container">
                <div class="roulette-pointer"></div>
                <div class="roulette-strip" id="roulette-strip"></div>
            </div>
        </div>
    </div>

    <!-- МОДАЛКА ПОДТВЕРЖДЕНИЯ -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-content">
            <h3 class="modal-title">Подтверждение</h3>
            <p class="confirm-text" id="confirm-text">Вы уверены?</p>
            <div class="modal-actions">
                <button class="btn-no" onclick="closeConfirm()">Нет</button>
                <button class="btn-yes" id="confirm-yes-btn">Да</button>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ptcofqwsvyytcnoerazu.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_CL2wAd6YW9tj5fIq4r9b4A_iVeZtnBx";
        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        const urlParams = new URLSearchParams(window.location.search);
        const paramId = urlParams.get('user_id');
        const userId = paramId ? parseInt(paramId) : ((tg.initDataUnsafe?.user?.id) ? tg.initDataUnsafe.user.id : 1780243205);

        // ЦЕННОСТИ: Юзернейм = 1000, Номер = 1500
        const NFT_USERNAMES = ["@spook", "@pumpk", "@ghost", "@witch", "@demon", "@batty", "@scary", "@crypt", "@trick", "@magic", "@vampy", "@haunt", "@bones", "@devil", "@raven", "@candy", "@skull", "@cursd", "@night", "@magik"];
        const ANON_PREVIEW = ["+8881234567", "+8889876543", "+8885556667", "+8881112223", "+8883334445", "+8880009991"];
        const HELL_ITEMS = ["Демонический череп", "Кровавый глаз", "Проклятая книга", "Адская мышь", "Адское пламя"];
        const COFFIN_ITEMS = ["Деревянный гроб", "Старая кость", "Паук-мутант", "Призрачная сеть", "Туман"];

        let currentAction = null; 

        async function loadBalance() {
            try {
                const { data } = await db.from('users').select('balance').eq('user_id', userId).single();
                if (data) document.getElementById('balance-amount').innerText = data.balance;
                else document.getElementById('balance-amount').innerText = "0";
            } catch (e) { console.error(e); }
        }

        async function loadInventory() {
            const list = document.getElementById('inventory-list');
            list.innerHTML = '<p class="empty-text">Загрузка...</p>';
            
            try {
                const { data } = await db.from('inventory').select('*').eq('user_id', userId).order('created_at', { ascending: false });
                if (!data || data.length === 0) {
                    list.innerHTML = '<p class="empty-text">Инвентарь пуст</p>';
                    return;
                }
                list.innerHTML = '';
                data.forEach(item => {
                    // Определяем ценность
                    let value = 0;
                    if (item.item_type === "Номер") value = 1500;
                    else if (item.item_type === "Юзернейм") value = 1000;
                    else value = 50; // Для остальных кейсов

                    const div = document.createElement('div');
                    div.className = 'inventory-item';
                    div.innerHTML = `
                        <div class="inv-info">
                            <span>${item.item_name}</span>
                            <small>${item.item_type} | ${value} 🎃</small>
                        </div>
                        <div class="inv-actions">
                            <button class="btn-sell" onclick="askAction('sell', ${item.id}, '${item.item_name}', ${value})">Продать</button>
                            <button class="btn-withdraw" onclick="askAction('withdraw', ${item.id}, '${item.item_name}', 0)">Вывод</button>
                        </div>
                    `;
                    list.appendChild(div);
                });
            } catch (e) {
                list.innerHTML = '<p class="empty-text">Ошибка загрузки</p>';
            }
        }

        function switchTab(tabName, element) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            element.classList.add('active');
            if (tabName === 'inventory') loadInventory();
        }

        // ФУНКЦИЯ ПОДТВЕРЖДЕНИЯ
        function askAction(action, itemId, itemName, value) {
            currentAction = { action, itemId, itemName, value };
            const text = action === 'sell' 
                ? `Продать "${itemName}" за ${value} 🎃?` 
                : `Запросить вывод "${itemName}"?`;
            
            document.getElementById('confirm-text').innerText = text;
            
            // Настраиваем кнопку "Да"
            const btnYes = document.getElementById('confirm-yes-btn');
            btnYes.onclick = () => confirmAction();
            
            document.getElementById('confirm-modal').classList.add('active');
        }

        function closeConfirm() {
            document.getElementById('confirm-modal').classList.remove('active');
            currentAction = null;
        }

        async function confirmAction() {
            if (!currentAction) return;
            const { action, itemId, itemName, value } = currentAction;

            if (action === 'sell') {
                // Добавляем баланс
                const currentBal = parseInt(document.getElementById('balance-amount').innerText);
                await db.from('users').update({ balance: currentBal + value }).eq('user_id', userId);
                // Удаляем предмет
                await db.from('inventory').delete().eq('id', itemId);
                tg.showAlert(`✅ Предмет продан за ${value} 🎃`);
                loadBalance();
                loadInventory();
            } else if (action === 'withdraw') {
                // Отправляем боту
                tg.sendData(JSON.stringify({ action: "withdraw", item_name: itemName, user_id: userId }));
                // Удаляем с сайта
                await db.from('inventory').delete().eq('id', itemId);
                tg.showAlert(`✅ Запрос на вывод отправлен!`);
                loadInventory();
            }

            closeConfirm();
        }

        // === АНИМАЦИЯ КЕЙСА ===
        async function openCase(caseId, price) {
            const currentBalance = parseInt(document.getElementById('balance-amount').innerText);
            if (currentBalance < price) {
                tg.showAlert("Недостаточно средств! Пополни баланс в боте.");
                return;
            }

            // Списываем баланс сразу
            await db.from('users').update({ balance: currentBalance - price }).eq('user_id', userId);
            loadBalance();

            // Определяем пул предметов
            let pool = [];
            if (caseId === 'nft') pool = NFT_USERNAMES;
            else if (caseId === 'anon') {
                for (let i = 0; i < 50; i++) {
                    let rnd = "";
                    for (let j = 0; j < 7; j++) rnd += Math.floor(Math.random() * 10);
                    pool.push("+888" + rnd);
                }
            }
            else if (caseId === 'hell') pool = HELL_ITEMS;
            else if (caseId === 'coffin') pool = COFFIN_ITEMS;

            // Выбираем победителя
            const prize = pool[Math.floor(Math.random() * pool.length)];
            let type = (caseId === 'nft' || caseId === 'anon') ? "Юзернейм" : "Подарок";
            if (caseId === 'anon') type = "Номер";
            
            // Записываем в БД
            await db.from('inventory').insert([{ user_id: userId, item_name: prize, item_type: type }]);

            // Настраиваем анимацию
            const strip = document.getElementById('roulette-strip');
            strip.innerHTML = '';
            strip.style.transition = 'none';
            strip.style.transform = 'translateX(0)';

            // Генерируем 50 элементов для прокрутки
            const displayPool = [...pool, ...pool, ...pool, ...pool, prize, ...pool];
            
            displayPool.forEach(item => {
                const div = document.createElement('div');
                div.className = 'roulette-item';
                div.innerText = item;
                strip.appendChild(div);
            });

            // Открываем модалку
            document.getElementById('roulette-modal').classList.add('active');
            
            // Ждем чуть-чуть и запускаем анимацию
            setTimeout(() => {
                const itemWidth = 120; // ширина + отступы
                const winnerIndex = displayPool.lastIndexOf(prize); // Индекс победителя
                // Прокручиваем так, чтобы победитель был под указателем (в центре)
                const screenWidth = window.innerWidth > 500 ? 500 : window.innerWidth;
                const centerOffset = screenWidth / 2;
                const targetX = -(winnerIndex * itemWidth) + centerOffset - (itemWidth / 2);

                strip.style.transition = 'transform 4s cubic-bezier(0.1, 0.7, 0.1, 1)';
                strip.style.transform = `translateX(${targetX}px)`;
            }, 100);

            // Закрываем через 4.5 секунды
            setTimeout(() => {
                document.getElementById('roulette-modal').classList.remove('active');
                tg.showAlert(`🎉 Твой выигрыш: ${prize}`);
                loadInventory();
            }, 4500);
        }

        loadBalance();
    </script>
</body>
</html>

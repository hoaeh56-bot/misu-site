<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Halloween Case</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background-color: #0a0a0a; background-image: radial-gradient(circle at top right, #1f1235 0%, #0a0a0a 50%); color: #fff; min-height: 100vh; display: flex; flex-direction: column; padding-bottom: 20px; }
        
        .top-bar { background: rgba(10, 10, 10, 0.8); backdrop-filter: blur(10px); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2b1b45; position: sticky; top: 0; z-index: 10; }
        .logo { font-size: 1.1rem; font-weight: 800; color: #fff; text-shadow: 0 0 15px #ff7b00; letter-spacing: 1px; }
        .balance-box { background: #151515; padding: 8px 16px; border-radius: 8px; border: 1px solid #333; font-weight: 800; font-size: 1rem; color: #fff; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        
        .container { padding: 20px; max-width: 600px; margin: 0 auto; width: 100%; }
        .nav-tabs { display: flex; gap: 15px; margin-bottom: 30px; }
        .nav-tab { flex: 1; text-align: center; padding: 12px; background: #151515; border: 1px solid #222; border-radius: 12px; color: #777; font-weight: 800; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: 0.3s; }
        .nav-tab.active { background: #1a1a1a; color: #fff; border-color: #ff7b00; box-shadow: inset 0 0 15px rgba(255,123,0,0.1), 0 0 15px rgba(255,123,0,0.2); }
        
        .section-title { color: #fff; margin-bottom: 20px; font-size: 1.1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; border-left: 3px solid #ff7b00; padding-left: 10px; }
        
        .cases-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .case-card { background: #111; border: 1px solid #222; border-radius: 16px; padding: 20px 15px; text-align: center; cursor: pointer; transition: 0.3s; display: flex; flex-direction: column; align-items: center; position: relative; overflow: hidden; }
        .case-card:active { transform: scale(0.96); border-color: #ff7b00; }
        .case-img { width: 110px; height: 110px; object-fit: contain; margin-bottom: 15px; filter: drop-shadow(0 0 15px rgba(255,123,0,0.4)); transition: 0.3s; }
        .case-card h3 { font-size: 0.85rem; font-weight: 600; margin-bottom: 12px; color: #ccc; line-height: 1.3; }
        .case-card p { color: #fff; font-weight: 800; font-size: 1rem; background: #1a1a1a; padding: 6px 14px; border-radius: 8px; border: 1px solid #333; }

        .inventory-list { display: flex; flex-direction: column; gap: 10px; }
        .inventory-item { background: #111; padding: 15px; border-radius: 12px; border: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        .inventory-item span { font-weight: 800; color: #fff; }
        .inventory-item small { color: #ff7b00; font-weight: 600; font-size: 0.8rem; }
        .empty-text { text-align: center; color: #555; margin-top: 40px; font-weight: 600; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Модальное окно */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; backdrop-filter: blur(10px); }
        .modal-overlay.active { display: flex; }
        .modal-content { background: #0f0f0f; border: 1px solid #333; border-radius: 24px; padding: 25px 20px; width: 100%; max-width: 400px; max-height: 85vh; display: flex; flex-direction: column; box-shadow: 0 20px 50px rgba(0,0,0,0.8), 0 0 40px rgba(255,123,0,0.15); position: relative; }
        
        .modal-title { color: #fff; margin-bottom: 20px; text-align: center; font-size: 1.2rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 0 10px rgba(255,255,255,0.3); }
        
        .modal-items-scroll { overflow-y: auto; flex: 1; margin-bottom: 20px; padding: 5px; }
        .modal-items-scroll::-webkit-scrollbar { width: 4px; }
        .modal-items-scroll::-webkit-scrollbar-thumb { background: #ff7b00; border-radius: 4px; }
        
        .modal-content ul { list-style: none; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .modal-content li { 
            background: linear-gradient(145deg, #1a1a1a, #111); 
            padding: 15px 10px; 
            border-radius: 12px; 
            border: 1px solid #2a2a2a; 
            font-weight: 600; 
            color: #eee; 
            text-align: center; 
            font-size: 0.85rem; 
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
            transition: 0.2s;
        }
        .modal-content li:hover { border-color: #ff7b00; box-shadow: 0 0 15px rgba(255,123,0,0.2); }

        .modal-actions { display: flex; gap: 10px; }
        .btn-open-case { background: #fff; color: #000; border: none; padding: 16px; border-radius: 14px; font-weight: 800; cursor: pointer; flex: 1; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; box-shadow: 0 0 20px rgba(255,255,255,0.2); transition: 0.2s; }
        .btn-fast-case { background: transparent; color: #fff; border: 1px solid #333; padding: 16px; border-radius: 14px; font-weight: 800; cursor: pointer; flex: 1; text-transform: uppercase; font-size: 0.9rem; letter-spacing: 1px; transition: 0.2s; }
        .close-btn { background: transparent; color: #555; border: none; padding: 15px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 5px; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
    </style>
</head>
<body>
    <header class="top-bar">
        <h1 class="logo">HALLOWEEN CASE</h1>
        <div class="balance-box"><span id="balance-amount">0</span> 🎃</div>
    </header>

    <main class="container">
        <div class="nav-tabs">
            <div class="nav-tab active" onclick="switchTab('cases', this)">Кейсы</div>
            <div class="nav-tab" onclick="switchTab('inventory', this)">Инвентарь</div>
        </div>

        <div id="tab-cases" class="tab-content active">
            <h2 class="section-title">Доступные кейсы</h2>
            <div class="cases-grid">
                <div class="case-card" onclick="viewContents('hell')">
                    <img src="https://f.2fools.app/tgs/sticker_set/f70510f3.gif" class="case-img">
                    <h3>АДСКИЙ КЕЙС</h3>
                    <p>300 🎃</p>
                </div>
                <div class="case-card" onclick="viewContents('coffin')">
                    <img src="https://f.2fools.app/tgs/sticker_set/debf8fd6.gif" class="case-img">
                    <h3>ГРОБНЫЙ КЕЙС</h3>
                    <p>250 🎃</p>
                </div>
                <div class="case-card" onclick="viewContents('nft')">
                    <img src="https://f.2fools.app/tgs/sticker_set/1a148ae3.gif" class="case-img">
                    <h3>NFT ЮЗЕРНЕЙМЫ</h3>
                    <p>1000 🎃</p>
                </div>
                <div class="case-card" onclick="viewContents('anon')">
                    <img src="https://f.2fools.app/tgs/sticker_set/baa518d9.gif" class="case-img">
                    <h3>АНОНИМНЫЕ НОМЕРА</h3>
                    <p>1500 🎃</p>
                </div>
            </div>
        </div>

        <div id="tab-inventory" class="tab-content">
            <h2 class="section-title">Твой инвентарь</h2>
            <div id="inventory-list" class="inventory-list">
                <p class="empty-text">Загрузка...</p>
            </div>
        </div>
    </main>

    <div class="modal-overlay" id="content-modal">
        <div class="modal-content">
            <h3 class="modal-title" id="modal-title">Содержимое</h3>
            <div class="modal-items-scroll">
                <ul id="modal-list"></ul>
            </div>
            <div class="modal-actions">
                <button class="btn-fast-case" onclick="openCase(currentCase, true)">Быстро</button>
                <button class="btn-open-case" onclick="openCase(currentCase, false)">Открыть</button>
            </div>
            <button class="close-btn" onclick="closeModal()">Закрыть</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ptcofqwsvyytcnoerazu.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_CL2wAd6YW9tj5fIq4r9b4A_iVeZtnBx";
        const { createClient } = supabase;
        const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();
        
        const userId = (tg.initDataUnsafe?.user?.id) ? tg.initDataUnsafe.user.id : 1780243205;

        const NFT_USERNAMES = ["@spook", "@pumpk", "@ghost", "@witch", "@demon", "@batty", "@scary", "@crypt", "@trick", "@magic", "@vampy", "@haunt", "@bones", "@devil", "@raven", "@candy", "@skull", "@cursd", "@night", "@magik"];
        
        const ANON_PREVIEW = ["+8881234567", "+8889876543", "+8885556667", "+8881112223", "+8883334445", "+8880009991"];

        const HELL_ITEMS = ["Демонический череп", "Кровавый глаз", "Проклятая книга", "Адская мышь", "Адское пламя"];

        const COFFIN_ITEMS = ["Деревянный гроб", "Старая кость", "Паук-мутант", "Призрачная сеть", "Туман"];

        let currentCase = null;

        async function loadBalance() {
            try {
                const { data } = await db.from('users').select('balance').eq('user_id', userId).single();
                if (data) document.getElementById('balance-amount').innerText = data.balance;
                else document.getElementById('balance-amount').innerText = "0";
            } catch (e) { console.error(e); }
        }

        async function loadInventory() {
            const list = document.getElementById('inventory-list');
            list.innerHTML = '<p class="empty-text">Загрузка...</p>';
            
            try {
                const { data } = await db.from('inventory').select('*').eq('user_id', userId).order('created_at', { ascending: false });
                if (!data || data.length === 0) {
                    list.innerHTML = '<p class="empty-text">Инвентарь пуст</p>';
                    return;
                }
                list.innerHTML = '';
                data.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'inventory-item';
                    div.innerHTML = `<span>${item.item_name}</span> <small>${item.item_type}</small>`;
                    list.appendChild(div);
                });
            } catch (e) {
                list.innerHTML = '<p class="empty-text">Ошибка загрузки</p>';
            }
        }

        function switchTab(tabName, element) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.nav-tab').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabName).classList.add('active');
            element.classList.add('active');
            if (tabName === 'inventory') loadInventory();
        }

        function viewContents(caseId) {
            currentCase = caseId;
            let title = "";
            let items = [];
            let price = 0;

            if (caseId === 'nft') { title = "NFT Юзернеймы"; items = NFT_USERNAMES; price = 1000; }
            else if (caseId === 'anon') { title = "Анонимные номера"; items = ANON_PREVIEW; price = 1500; }
            else if (caseId === 'hell') { title = "Адский кейс"; items = HELL_ITEMS; price = 300; }
            else if (caseId === 'coffin') { title = "Гробный кейс"; items = COFFIN_ITEMS; price = 250; }

            document.getElementById('modal-title').innerText = `${title} | ${price} 🎃`;
            const list = document.getElementById('modal-list');
            list.innerHTML = '';
            
            items.forEach(item => {
                const li = document.createElement('li');
                li.innerText = item;
                list.appendChild(li);
            });

            document.getElementById('content-modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('content-modal').classList.remove('active');
        }

        async function openCase(caseId, isFast) {
            let price = 0;
            if (caseId === 'nft') price = 1000;
            else if (caseId === 'anon') price = 1500;
            else if (caseId === 'hell') price = 300;
            else if (caseId === 'coffin') price = 250;

            const currentBalance = parseInt(document.getElementById('balance-amount').innerText);
            if (currentBalance < price) {
                tg.showAlert("Недостаточно средств! Пополни баланс в боте через /buy");
                return;
            }

            closeModal();

            let prize = "";
            let type = "";

            if (caseId === 'nft') { 
                prize = NFT_USERNAMES[Math.floor(Math.random() * NFT_USERNAMES.length)]; 
                type = "Юзернейм"; 
            } else if (caseId === 'anon') { 
                let randomDigits = "";
                for (let i = 0; i < 7; i++) randomDigits += Math.floor(Math.random() * 10);
                prize = "+888" + randomDigits; 
                type = "Номер"; 
            } else if (caseId === 'hell') { 
                prize = HELL_ITEMS[Math.floor(Math.random() * HELL_ITEMS.length)]; 
                type = "Подарок"; 
            } else if (caseId === 'coffin') { 
                prize = COFFIN_ITEMS[Math.floor(Math.random() * COFFIN_ITEMS.length)]; 
                type = "Подарок"; 
            }

            const newBalance = currentBalance - price;
            await db.from('users').update({ balance: newBalance }).eq('user_id', userId);
            await db.from('inventory').insert([{ user_id: userId, item_name: prize, item_type: type }]);

            if (isFast) {
                tg.showAlert(`Выпало: ${prize}`);
            } else {
                tg.showAlert(`Открываем...`);
                setTimeout(() => {
                    tg.showAlert(`🎉 Поздравляем!\n\nТвой выигрыш: ${prize}`);
                }, 1200);
            }
            
            loadBalance();
        }

        loadBalance();
    </script>
</body>
</html>

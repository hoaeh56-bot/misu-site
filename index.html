
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gift Boost - Final</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body { 
            background: radial-gradient(circle at 50% 20%, #15151e 0%, #000000 70%); 
            color: #fff; 
            display: flex; flex-direction: column; min-height: 100vh; overflow-y: auto;
        }

        /* Уведомления */
        .toast-container { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 9999; display: flex; flex-direction: column; gap: 10px; pointer-events: none; width: 90%; max-width: 350px; }
        .toast { background: #1c1c28; border: 1px solid #ffd700; color: #fff; padding: 12px 20px; border-radius: 12px; font-size: 14px; font-weight: 600; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.5); opacity: 0; transform: translateY(-20px); transition: 0.3s; }
        .toast.show { opacity: 1; transform: translateY(0); }

        /* Шапка */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; }
        .balance-pill { display: flex; align-items: center; border: 1px solid #ffd700; padding: 6px 14px; border-radius: 20px; gap: 6px; color: #ffd700; font-weight: 800; font-size: 15px; background: rgba(255, 215, 0, 0.1); }
        .btn-topup { background: #ffd700; color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 800; font-size: 13px; cursor: pointer; }

        /* Панель апгрейда */
        .upgrade-bar { display: none; justify-content: space-between; align-items: center; background: #1c1c28; margin: 0 20px 10px; padding: 10px 15px; border-radius: 12px; border: 1px solid #4cd964; }
        .upgrade-bar.active { display: flex; }
        .upgrade-info { font-size: 12px; font-weight: 600; color: #4cd964; }
        .btn-cancel-upgrade { background: none; border: none; color: #ff4444; font-size: 20px; font-weight: 800; cursor: pointer; padding: 0 5px; }

        /* Колесо */
        .wheel-zone { display: flex; justify-content: center; padding: 10px 0 30px; position: relative; }
        .wheel-outer { position: relative; width: 260px; height: 260px; }
        
        .wheel-bg { position: absolute; width: 100%; height: 100%; border-radius: 50%; background: #111116; box-shadow: inset 0 0 20px rgba(0,0,0,1); z-index: 1; }
        
        /* Оранжевая полоса */
        .progress-ring {
            position: absolute; width: 100%; height: 100%; border-radius: 50%; z-index: 2;
            background: conic-gradient(from 180deg, #ff8c00 0%, #ff8c00 var(--progress, 0%), transparent var(--progress, 0%), transparent 100%);
            -webkit-mask: radial-gradient(transparent 86px, black 87px);
            mask: radial-gradient(transparent 86px, black 87px);
            transition: background 0.3s ease;
        }

        .wheel-inner { 
            position: absolute; width: 172px; height: 172px; border-radius: 50%; 
            background: #000; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 3; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            overflow: hidden; border: 1px solid #222;
        }
        
        .result-container { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            background: #000; display: flex; flex-direction: column; justify-content: center; align-items: center; 
            opacity: 0; transition: opacity 0.3s ease; z-index: 10; pointer-events: none; 
            overflow: hidden; 
        }
        .result-container.show { opacity: 1; }
        
        .result-icon { width: 40px; height: 40px; margin-bottom: 5px; stroke-dasharray: 100; stroke-dashoffset: 100; }
        .result-container.show .result-icon { animation: draw 0.5s cubic-bezier(0.1, 0.7, 0.1, 1) forwards; }
        
        .result-text { font-size: 12px; font-weight: 800; line-height: 1.1; padding: 0 10px; text-align: center; }
        .result-text.win { color: #4cd964; }
        .result-text.top { color: #ffd700; text-shadow: 0 0 10px rgba(255,215,0,0.8); font-size: 14px; }
        .result-text.lose { color: #ff4444; font-size: 14px; }
        
        @keyframes draw { to { stroke-dashoffset: 0; } }

        .percent-num { font-size: 32px; font-weight: 800; color: #fff; transition: opacity 0.3s; }
        .percent-lbl { font-size: 11px; color: #ff4444; margin-top: 2px; font-weight: 700; letter-spacing: 1px; transition: opacity 0.3s; }

        /* Стрелка */
        .arrow-container { position: absolute; width: 260px; height: 260px; pointer-events: none; z-index: 5; }
        .arrow-svg { position: absolute; bottom: -10px; left: 50%; transform: translateX(-50%); width: 20px; height: 32px; filter: drop-shadow(0 0 6px rgba(255, 215, 0, 1)); }

        /* Карточки */
        .gift-cards { display: flex; justify-content: center; gap: 12px; z-index: 10; }
        .gift-card { width: 135px; border-radius: 16px; padding: 8px; display: flex; flex-direction: column; align-items: center; position: relative; cursor: pointer; transition: 0.2s; border: 2px solid transparent; background: #111116; }
        .gift-card.active { border-color: #ffd700; box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); }
        .gift-card.westside { background: linear-gradient(180deg, #1a2a5a 0%, #0a1030 100%); }
        .gift-card.xmas { background: linear-gradient(180deg, #3a1a4a 0%, #1a0a2a 100%); }

        .gift-price { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.6); padding: 3px 8px; border-radius: 10px; font-size: 11px; font-weight: 700; z-index: 2;}
        .gift-price.blue { background: #007bff; }
        
        .gift-image-wrapper { 
            width: 70px; height: 70px; margin: 20px 0 10px; 
            display: flex; justify-content: center; align-items: center; 
            position: relative; overflow: hidden; border-radius: 8px;
        }
        
        /* Картинки (GIF/PNG) */
        .gift-img { width: 100%; height: 100%; object-fit: contain; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5)); }

        .gift-name { font-size: 13px; font-weight: 700; text-align: center; }
        .gift-sub { font-size: 11px; color: rgba(255,255,255,0.5); margin-top: 2px; }

        /* Управление */
        .controls { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .action-row { display: flex; gap: 8px; }
        .btn-icon { width: 45px; height: 45px; background: #111116; border: 1px solid #22222a; border-radius: 12px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .btn-icon svg { width: 20px; height: 20px; stroke: #888; fill: none; stroke-width: 2; }
        .btn-icon.active svg { stroke: #ffd700; filter: drop-shadow(0 0 5px #ffd700); }
        
        .btn-boost { flex-grow: 1; background: #ffd700; color: #000; border: none; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s; text-transform: uppercase; }
        .btn-boost:active { transform: scale(0.98); }
        .btn-boost:disabled { background: #1a1a24; color: #444; }
        
        .chances-grid { display: flex; justify-content: center; gap: 6px; margin-top: 5px; }
        .chance-btn { flex: 1; background: #111116; border: 1px solid #22222a; color: #666; padding: 10px 0; border-radius: 10px; font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; transition: 0.2s; }
        .chance-btn.active { border-color: #ffd700; color: #ffd700; background: rgba(255, 215, 0, 0.05); }

        /* Табы и Инвентарь */
        .tabs-container { padding: 0 20px 20px; }
        .tabs { display: flex; background: #0a0a0f; border-radius: 14px; padding: 5px; border: 1px solid #1a1a25; }
        .tab { flex: 1; text-align: center; padding: 12px; font-size: 13px; font-weight: 700; color: #555; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .tab.active { background: #1c1c28; color: #fff; border: 1px solid #2a2a35; }

        .list-container { padding: 0 20px 30px; }
        .grid-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .grid-item { background: #111116; border: 1px solid #22222a; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; align-items: center; position: relative; transition: 0.3s; }
        .grid-item.westside { background: linear-gradient(180deg, #1a2a5a 0%, #0a1030 100%); }
        .grid-item.selected { border-color: #4cd964; box-shadow: 0 0 10px rgba(76,217,100,0.3); }
        .grid-item .gift-price { top: 6px; right: 6px; font-size: 10px; padding: 2px 6px; }
        
        .grid-item .gift-image-wrapper { width: 50px; height: 50px; margin: 15px 0 5px; }
        
        .grid-item .gift-name { font-size: 12px; font-weight: 600; }
        
        .action-btns { display: flex; gap: 5px; width: 100%; margin-top: 8px; }
        .btn-action { flex: 1; padding: 6px; border-radius: 6px; font-size: 10px; font-weight: 800; cursor: pointer; text-align: center; border: none; }
        .btn-upgrade { background: #ffd700; color: #000; }
        .btn-withdraw { background: #4cd964; color: #000; }

        /* Модалка для ввода */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-overlay.show { display: flex; }
        .modal-content { background: #1c1c28; padding: 20px; border-radius: 16px; width: 80%; max-width: 300px; text-align: center; border: 1px solid #2a2a35; }
        .modal-content h3 { margin-bottom: 15px; font-size: 16px; }
        .modal-input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #333; background: #0d0d12; color: #fff; font-size: 16px; text-align: center; margin-bottom: 15px; outline: none; }
        .modal-btn { width: 100%; background: #ffd700; color: #000; border: none; padding: 10px; border-radius: 8px; font-weight: 800; cursor: pointer; }
        .modal-btn.cancel { background: #333; color: #fff; margin-top: 8px; }

        .settings-modal { width: 90%; max-width: 350px; }
        .setting-row { display: flex; justify-content: space-between; align-items: center; background: #0d0d12; padding: 10px; border-radius: 8px; margin-bottom: 8px; border: 1px solid #222; }
        .setting-row span { font-weight: 700; }
        .btn-edit-chance { background: #ffd700; color: #000; border: none; padding: 5px 10px; border-radius: 5px; font-weight: 700; cursor: pointer; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="toast-container" id="toastContainer"></div>

    <div class="header">
        <div class="balance-pill"><span>⭐</span> <span id="balanceDisplay">800.00</span></div>
        <button class="btn-topup" onclick="showToast('Пополнение временно недоступно')">+ Пополнить</button>
    </div>

    <div class="upgrade-bar" id="upgradeBar">
        <div class="upgrade-info" id="upgradeText">Апгрейд</div>
        <button class="btn-cancel-upgrade" onclick="cancelUpgrade()">✖</button>
    </div>

    <div class="wheel-zone">
        <div class="wheel-outer">
            <div class="wheel-bg"></div>
            <div class="progress-ring" id="progressRing"></div>
            <div class="wheel-inner">
                <div id="percentContainer" style="display: flex; flex-direction: column; align-items: center;">
                    <div class="percent-num" id="chanceDisplay">10.00%</div>
                    <div class="percent-lbl" id="chanceLabel">ШАНС</div>
                </div>
                <div class="result-container" id="resultContainer"></div>
            </div>
            <div class="arrow-container" id="arrowContainer">
                <svg class="arrow-svg" viewBox="0 0 20 32" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 32 L0 12 L6 12 L6 0 L14 0 L14 12 L20 12 Z" fill="#ffd700"/>
                </svg>
            </div>
        </div>
    </div>

    <div class="gift-cards">
        <!-- Используем GIF для руки -->
        <div class="gift-card westside active" onclick="selectBetGift(this, 100, 'Westside Ring', '#136', 'https://media.tenor.com/2k4y2VqF9sAAAAAj/hand.gif')">
            <div class="gift-price">⭐ 100</div>
            <div class="gift-image-wrapper">
                <img src="https://media.tenor.com/2k4y2VqF9sAAAAAj/hand.gif" class="gift-img">
            </div>
            <div class="gift-name">Westside Ring</div>
            <div class="gift-sub">#136</div>
        </div>
        
        <div class="gift-card xmas" onclick="selectBetGift(this, 3.19, 'Xmas Stocking', '#200912', 'https://cdn-icons-png.flaticon.com/512/4213/4213230.png')">
            <div class="gift-price blue">🌍 3.19</div>
            <div class="gift-image-wrapper">
                <img src="https://cdn-icons-png.flaticon.com/512/4213/4213230.png" class="gift-img">
            </div>
            <div class="gift-name">Xmas Stocking</div>
            <div class="gift-sub">#200912</div>
        </div>
    </div>

    <div class="controls">
        <div class="action-row">
            <div class="btn-icon" onclick="openSettingsModal()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></div>
            
            <button class="btn-boost" id="spinBtn" onclick="spin()">Забустить</button>
            
            <div class="btn-icon" id="fastSpinBtn" onclick="toggleFastSpin()">
                <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            </div>
        </div>
        
        <div class="chances-grid" id="chancesGrid">
            <div class="chance-btn" onclick="setChance(50, this)" data-chance="50">x2</div>
            <div class="chance-btn" onclick="setChance(25, this)" data-chance="25">x4</div>
            <div class="chance-btn active" onclick="setChance(10, this)" data-chance="10">x10</div>
            <div class="chance-btn" onclick="setChance(5, this)" data-chance="5">x20</div>
        </div>
    </div>

    <div class="tabs-container">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('inv', this)">Инвентарь</div>
            <div class="tab" onclick="switchTab('wish', this)">Желаемые</div>
        </div>
    </div>

    <div class="list-container" id="inv-section">
        <div class="grid-list" id="inv-list"></div>
    </div>

    <div class="list-container hidden" id="wish-section">
        <div class="grid-list" id="wish-list">
            <div class="grid-item" onclick="selectWishItem(this, 1000, 'Redo')">
                <div class="gift-price">⭐ 1000</div>
                <div class="gift-image-wrapper">
                    <img src="https://cdn-icons-png.flaticon.com/512/4213/4213230.png" class="gift-img">
                </div>
                <div class="gift-name">Redo</div>
                <div class="gift-sub">#99999</div>
            </div>
            <div class="grid-item" onclick="selectWishItem(this, 15000, 'Liberty Figure')">
                <div class="gift-price">⭐ 15000</div>
                <div class="gift-image-wrapper">
                    <!-- Статуя Свободы как GIF/PNG -->
                    <img src="https://media.tenor.com/9qXm4yVqF9sAAAAAj/statue.gif" class="gift-img">
                </div>
                <div class="gift-name">Liberty Figure</div>
                <div class="gift-sub">#68</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="settingsModal">
        <div class="modal-content settings-modal">
            <h3>Настройка кнопок</h3>
            <div id="settingsList"></div>
            <button class="modal-btn cancel" onclick="closeSettingsModal()">Закрыть</button>
        </div>
    </div>

    <div class="modal-overlay" id="chanceModal">
        <div class="modal-content">
            <h3>Введите шанс (%)</h3>
            <input type="number" class="modal-input" id="modalChanceInput" min="1" max="90" value="10">
            <button class="modal-btn" onclick="saveChance()">Сохранить</button>
            <button class="modal-btn cancel" onclick="closeChanceModal()">Отмена</button>
        </div>
    </div>

    <script>
        function showToast(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            container.innerHTML = '';
            container.appendChild(toast);
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 2000);
        }

        let balance = 800.00;
        let baseChance = 10;
        let rotation = 0;
        let isSpinning = false;
        let isFastSpin = false;
        let betAmount = 100;
        let currentBetName = 'Westside Ring';
        let currentBetImg = '';
        let spinsSinceTopDrop = 0;
        const PITY_LIMIT = 10;
        let upgradeItem = null; 
        let wishItem = null; 

        let inventory = [
            { id: '#136', name: 'Westside Ring', price: 2500, img: 'https://media.tenor.com/2k4y2VqF9sAAAAAj/hand.gif' }
        ];

        function updateUI() {
            document.getElementById('balanceDisplay').innerText = balance.toFixed(2);
            document.getElementById('chanceDisplay').innerText = baseChance.toFixed(2) + "%";
            
            let visualProgress = baseChance < 2 && baseChance > 0 ? 2 : baseChance; 
            document.getElementById('progressRing').style.setProperty('--progress', visualProgress + '%');
            
            if (baseChance === 0) {
                document.getElementById('chanceLabel').innerText = 'ВЫБЕРИТЕ ЦЕЛЬ';
                document.getElementById('chanceLabel').style.color = '#666';
            } else if (baseChance >= 50) {
                document.getElementById('chanceLabel').innerText = 'ВЫСОКИЙ ШАНС';
                document.getElementById('chanceLabel').style.color = '#4cd964';
            } else if (baseChance <= 10) {
                document.getElementById('chanceLabel').innerText = 'ВЫСОКИЙ РИСК';
                document.getElementById('chanceLabel').style.color = '#ff4444';
            } else {
                document.getElementById('chanceLabel').innerText = 'СРЕДНИЙ ШАНС';
                document.getElementById('chanceLabel').style.color = '#666';
            }

            renderInventory();
        }

        function renderInventory() {
            const list = document.getElementById('inv-list');
            list.innerHTML = '';
            
            inventory.forEach((item, index) => {
                const el = document.createElement('div');
                el.className = 'grid-item westside';

                el.innerHTML = `
                    <div class="gift-price">⭐ ${item.price}</div>
                    <div class="gift-image-wrapper">
                        <img src="${item.img}" class="gift-img">
                    </div>
                    <div class="gift-name">${item.name}</div>
                    <div class="gift-sub">${item.id}</div>
                    <div class="action-btns">
                        <button class="btn-action btn-upgrade" onclick="startUpgrade(${index})">Апгрейд</button>
                        <button class="btn-action btn-withdraw" onclick="withdrawItem(${index})">Вывод</button>
                    </div>
                `;
                list.appendChild(el);
            });
        }

        function withdrawItem(index) {
            let item = inventory[index];
            showToast(`Заявка на вывод: ${item.name} (${item.price} ⭐) отправлена!`);
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            if (tab === 'inv') {
                document.getElementById('inv-section').classList.remove('hidden');
                document.getElementById('wish-section').classList.add('hidden');
            } else {
                document.getElementById('inv-section').classList.add('hidden');
                document.getElementById('wish-section').classList.remove('hidden');
            }
        }

        function selectBetGift(el, price, name, id, imgUrl) {
            if (isSpinning) return;
            document.querySelectorAll('.gift-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            betAmount = price;
            currentBetName = name;
            currentBetImg = imgUrl;
            cancelUpgrade(); 
        }

        function toggleFastSpin() {
            isFastSpin = !isFastSpin;
            const btn = document.getElementById('fastSpinBtn');
            if (isFastSpin) {
                btn.classList.add('active');
                showToast("Быстрая крутка ВКЛ");
            } else {
                btn.classList.remove('active');
                showToast("Быстрая крутка ВЫКЛ");
            }
        }

        function openSettingsModal() {
            if (isSpinning) return;
            const list = document.getElementById('settingsList');
            list.innerHTML = '';
            
            const btns = document.querySelectorAll('.chances-grid .chance-btn');
            btns.forEach((btn, i) => {
                let val = btn.getAttribute('data-chance');
                let row = document.createElement('div');
                row.className = 'setting-row';
                row.innerHTML = `
                    <span>Кнопка ${i+1} (${val}%)</span>
                    <button class="btn-edit-chance" onclick="editChanceFromSettings(${i})">Изменить</button>
                `;
                list.appendChild(row);
            });

            document.getElementById('settingsModal').classList.add('show');
        }

        function closeSettingsModal() {
            document.getElementById('settingsModal').classList.remove('show');
        }

        let editingChanceBtn = null;

        function editChanceFromSettings(index) {
            closeSettingsModal();
            const btns = document.querySelectorAll('.chances-grid .chance-btn');
            editingChanceBtn = btns[index];
            let currentVal = editingChanceBtn.getAttribute('data-chance');
            
            document.getElementById('modalChanceInput').value = currentVal;
            document.getElementById('chanceModal').classList.add('show');
        }

        function closeChanceModal() {
            document.getElementById('chanceModal').classList.remove('show');
            editingChanceBtn = null;
        }

        function saveChance() {
            let val = Number(document.getElementById('modalChanceInput').value);
            if (val < 1) val = 1;
            if (val > 90) val = 90;

            if (editingChanceBtn) {
                editingChanceBtn.setAttribute('data-chance', val);
                let multiplier = Math.floor(100 / val);
                if (multiplier < 2) multiplier = 2;
                editingChanceBtn.innerText = "x" + multiplier;
                
                if (editingChanceBtn.classList.contains('active')) {
                    baseChance = val;
                    updateUI();
                }
                showToast(`Сохранено: ${val}%`);
            }
            closeChanceModal();
        }

        function setChance(val, el) {
            if (isSpinning || upgradeItem) return;
            baseChance = val;
            document.querySelectorAll('.chance-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            updateUI();
        }

        function startUpgrade(index) {
            upgradeItem = inventory[index];
            if (!wishItem) {
                showToast("Сначала выберите желаемый предмет!");
                return;
            }
            
            let newChance = (upgradeItem.price / wishItem.price) * 100;
            if (newChance > 90) newChance = 90;
            if (newChance < 1) newChance = 1;
            
            baseChance = Number(newChance.toFixed(2));
            
            const bar = document.getElementById('upgradeBar');
            const text = document.getElementById('upgradeText');
            text.innerText = `${upgradeItem.name} ➔ ${wishItem.name} (${baseChance}%)`;
            bar.classList.add('active');
            
            document.querySelectorAll('.chance-btn').forEach(b => b.classList.remove('active'));
            
            betAmount = upgradeItem.price;
            currentBetName = upgradeItem.name;
            currentBetImg = upgradeItem.img;
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
            updateUI();
        }

        function cancelUpgrade() {
            if (isSpinning) return;
            upgradeItem = null;
            wishItem = null;
            document.getElementById('upgradeBar').classList.remove('active');
            
            baseChance = 10;
            const btns = document.querySelectorAll('.chances-grid .chance-btn');
            btns.forEach(b => b.classList.remove('active'));
            if(btns[2]) btns[2].classList.add('active');
            
            document.querySelectorAll('#wish-list .grid-item').forEach(c => c.classList.remove('selected'));
            updateUI();
        }

        function selectWishItem(el, price, name) {
            if (isSpinning) return;
            document.querySelectorAll('#wish-list .grid-item').forEach(c => c.classList.remove('selected'));
            el.classList.add('selected');
            wishItem = { price, name };
            showToast(`Выбран желаемый: ${name}`);
        }

        function spin() {
            if (isSpinning) return;
            if (baseChance === 0) {
                showToast("Выберите цель!");
                return;
            }
            if (balance < betAmount && !upgradeItem) {
                showToast("Недостаточно средств!");
                return;
            }

            isSpinning = true;
            const btn = document.getElementById('spinBtn');
            const arrow = document.getElementById('arrowContainer');
            const percentContainer = document.getElementById('percentContainer');
            const resultContainer = document.getElementById('resultContainer');
            
            resultContainer.classList.remove('show');
            percentContainer.style.opacity = '1';
            
            btn.innerText = "Крутим...";
            btn.disabled = true;

            if (!upgradeItem) {
                balance -= betAmount;
                updateUI();
            }

            let isWin = false;
            let isTopDrop = false;

            if (spinsSinceTopDrop >= PITY_LIMIT) {
                isTopDrop = true;
                spinsSinceTopDrop = 0;
            } else {
                let roll = Math.random() * 100;
                if (roll < 2) {
                    isTopDrop = true;
                    spinsSinceTopDrop = 0;
                } else {
                    isWin = roll <= baseChance;
                    spinsSinceTopDrop++;
                }
            }

            // --- ИДЕАЛЬНАЯ МАТЕМАТИКА УГЛОВ ---
            // Стрелка смотрит вниз (0 градусов).
            // Оранжевая полоса начинается с 180 градусов (6 часов) и идет по часовой.
            
            let targetDeg = 0;
            let chanceDeg = (baseChance / 100) * 360;
            let startAngle = 180; 
            let endAngle = startAngle + chanceDeg;

            if (isTopDrop) {
                targetDeg = 170; 
            } else if (isWin) {
                targetDeg = startAngle + Math.random() * chanceDeg;
            } else {
                do {
                    targetDeg = Math.random() * 360;
                } while (targetDeg > startAngle && targetDeg < endAngle);
            }

            let currentMod = rotation % 360;
            let diff = targetDeg - currentMod;
            if (diff < 0) diff += 360;

            const spins = isFastSpin ? 3 : 6;
            const duration = isFastSpin ? 1.5 : 3;
            
            // Включаем анимацию CSS
            arrow.style.transition = `transform ${duration}s cubic-bezier(0.1, 0.7, 0.1, 1)`;
            
            rotation += (spins * 360) + diff;
            arrow.style.transform = `rotate(${rotation}deg)`;

            setTimeout(() => {
                // Отключаем анимацию для сброса, чтобы не было рывков
                arrow.style.transition = 'none';
                rotation = rotation % 360;
                arrow.style.transform = `rotate(${rotation}deg)`;
                
                percentContainer.style.opacity = '0';

                if (isTopDrop && navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 500]);

                if (isTopDrop) {
                    resultContainer.innerHTML = `
                        <img src="https://media.tenor.com/9qXm4yVqF9sAAAAAj/statue.gif" style="width: 50px; height: 50px; object-fit: contain;">
                        <div class="result-text top" style="margin-top: 5px;">ТОП ДРОП</div>
                    `;
                    let prizePrice = betAmount * 10;
                    balance += prizePrice;
                    inventory.push({ id: '#68', name: 'Liberty Figure', price: prizePrice, img: 'https://media.tenor.com/9qXm4yVqF9sAAAAAj/statue.gif' });
                    
                    if (upgradeItem) {
                        inventory = inventory.filter(item => item !== upgradeItem);
                        cancelUpgrade();
                    }
                    showToast(`👑 ТОП ДРОП!\nВы выиграли Liberty Figure!`);
                    
                } else if (isWin) {
                    resultContainer.innerHTML = `
                        <svg class="result-icon" style="color: #4cd964; stroke-dashoffset: 0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                        <div class="result-text win">Поздравляю!</div>
                    `;
                    let winAmount = Math.floor(betAmount * (100 / baseChance));
                    balance += winAmount;
                    
                    if (upgradeItem && wishItem) {
                        inventory.push({ id: '#UPG', name: wishItem.name, price: wishItem.price, img: 'https://media.tenor.com/9qXm4yVqF9sAAAAAj/statue.gif' });
                        inventory = inventory.filter(item => item !== upgradeItem);
                        cancelUpgrade();
                    } else {
                        inventory.push({ id: '#WIN', name: currentBetName, price: winAmount, img: currentBetImg });
                    }
                    
                } else {
                    resultContainer.innerHTML = `
                        <svg class="result-icon" style="color: #ff4444; stroke-dashoffset: 0;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                        <div class="result-text lose">Неудача</div>
                    `;
                    
                    if (upgradeItem) {
                        inventory = inventory.filter(item => item !== upgradeItem);
                        cancelUpgrade();
                    }
                }

                resultContainer.classList.add('show');
                updateUI();

                setTimeout(() => {
                    resultContainer.classList.remove('show');
                    percentContainer.style.opacity = '1';
                    isSpinning = false;
                    btn.disabled = false;
                    btn.innerText = "Забустить";
                    
                    // Восстанавливаем transition для следующей крутки
                    setTimeout(() => {
                        arrow.style.transition = `transform ${isFastSpin ? 1.5 : 3}s cubic-bezier(0.1, 0.7, 0.1, 1)`;
                    }, 50);

                }, 2000);

            }, (duration * 1000) + 100);
        }

        updateUI();
    </script>
</body>
</html>

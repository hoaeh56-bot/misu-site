<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gift Boost</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

        * { box-sizing: border-box; font-family: 'Inter', sans-serif; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
        body { background: radial-gradient(circle at 50% 20%, #1a1a24 0%, #000000 70%); color: #fff; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

        /* --- ХЕДЕР --- */
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px; z-index: 10; }
        .balance-pill { display: flex; align-items: center; border: 1px solid #ffd700; padding: 6px 14px; border-radius: 20px; gap: 6px; color: #ffd700; font-weight: 700; font-size: 14px; background: rgba(255, 215, 0, 0.05); }
        .btn-topup { background: #ffd700; color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; }

        /* --- БАРАБАН --- */
        .wheel-zone { flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        
        .wheel-outer { position: relative; width: 260px; height: 260px; display: flex; justify-content: center; align-items: center; }
        
        /* Темное кольцо */
        .wheel-bg { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 16px solid #14141e; background: #09090e; box-shadow: inset 0 0 20px rgba(0,0,0,1); }
        
        /* Оранжевая заливка (прогресс) */
        .wheel-progress { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 16px solid transparent; border-bottom-color: #ff8c00; border-right-color: #ff8c00; border-top-color: #ff8c00; transform: rotate(-45deg); opacity: 0; transition: opacity 0.3s; z-index: 1; }
        .wheel-progress.active { opacity: 1; }

        /* Внутренний круг с процентами */
        .wheel-inner { position: absolute; width: 160px; height: 160px; border-radius: 50%; background: #000; z-index: 2; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow: hidden; }
        
        .percent-num { font-size: 44px; font-weight: 800; letter-spacing: -1px; transition: opacity 0.3s; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.2); }
        .percent-lbl { font-size: 11px; color: #666; margin-top: 2px; transition: opacity 0.3s; }

        /* Анимация результата (появляется поверх процентов) */
        .result-container { position: absolute; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; height: 100%; opacity: 0; transition: opacity 0.3s ease; z-index: 10; pointer-events: none; background: #000; }
        .result-container.show { opacity: 1; }
        
        .result-icon { width: 50px; height: 50px; margin-bottom: 5px; stroke-dasharray: 100; stroke-dashoffset: 100; animation: draw 0.5s ease forwards; }
        .result-text { font-size: 18px; font-weight: 800; text-align: center; }
        .result-text.win { color: #4cd964; }
        .result-text.lose { color: #666; font-size: 14px; }
        
        .result-gift-info { text-align: center; margin-top: 2px; }
        .result-gift-name { font-size: 12px; font-weight: 600; color: #fff; }
        .result-gift-id { font-size: 9px; color: #888; }

        @keyframes draw { to { stroke-dashoffset: 0; } }

        /* Стрелка */
        .arrow-container { position: absolute; width: 260px; height: 260px; pointer-events: none; z-index: 5; transition: transform 3.5s cubic-bezier(0.1, 0.7, 0.1, 1); }
        .arrow-svg { position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%); width: 20px; height: 32px; filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.8)); }

        /* --- КАРТОЧКИ ПОДАРКОВ --- */
        .gift-cards { display: flex; justify-content: center; gap: 12px; margin-top: 15px; z-index: 10; }
        .gift-card { width: 130px; background: #111116; border: 1px solid #22222a; border-radius: 16px; padding: 8px; display: flex; flex-direction: column; align-items: center; position: relative; cursor: pointer; transition: 0.2s; }
        .gift-card.active { border-color: #ffd700; background: rgba(255, 215, 0, 0.05); }
        .gift-price { position: absolute; top: 6px; right: 6px; background: #222; color: #fff; padding: 2px 6px; border-radius: 8px; font-size: 10px; font-weight: 600; }
        .gift-price.blue { background: #007bff; }
        .gift-img { width: 50px; height: 50px; object-fit: contain; margin: 15px 0 5px; }
        .gift-name { font-size: 12px; font-weight: 600; text-align: center; }
        .gift-sub { font-size: 10px; color: #666; }

        /* --- УПРАВЛЕНИЕ --- */
        .controls { padding: 15px; z-index: 10; display: flex; flex-direction: column; gap: 10px; }
        
        .action-row { display: flex; gap: 8px; }
        .btn-icon { width: 45px; height: 45px; background: #111116; border: 1px solid #22222a; border-radius: 12px; display: flex; justify-content: center; align-items: center; cursor: pointer; }
        .btn-icon svg { width: 20px; height: 20px; stroke: #888; fill: none; stroke-width: 2; }
        
        .btn-boost { flex-grow: 1; background: #ffd700; color: #000; border: none; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; transition: 0.2s; }
        .btn-boost:active { transform: scale(0.98); }
        .btn-boost:disabled { background: #1a1a24; color: #444; }
        
        /* Кнопки шансов (Центр) */
        .chances-grid { display: flex; justify-content: center; gap: 6px; }
        .chance-btn { flex: 1; max-width: 60px; background: #111116; border: 1px solid #22222a; color: #666; padding: 10px 0; border-radius: 10px; font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; transition: 0.2s; }
        .chance-btn.active { border-color: #ffd700; color: #ffd700; background: rgba(255, 215, 0, 0.05); }
        .chance-btn.red { border-color: #ff4444; color: #ff4444; }
        .chance-btn.yellow { border-color: #ffd700; color: #ffd700; }
        .chance-btn.green { border-color: #44ff44; color: #44ff44; }

        /* --- ВКЛАДКИ (Объемные) --- */
        .tabs-container { padding: 0 15px 15px; }
        .tabs { display: flex; background: #0a0a0f; border-radius: 14px; padding: 5px; border: 1px solid #1a1a25; box-shadow: inset 0 2px 5px rgba(0,0,0,0.8); }
        .tab { flex: 1; text-align: center; padding: 12px; font-size: 13px; font-weight: 700; color: #555; border-radius: 10px; cursor: pointer; transition: 0.2s; }
        .tab.active { background: #1c1c28; color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.5); border: 1px solid #2a2a35; }

        /* --- СПИСКИ --- */
        .list-container { padding: 0 15px 15px; flex-grow: 1; overflow-y: auto; max-height: 140px; }
        .list-item { background: #111116; border: 1px solid #22222a; border-radius: 12px; padding: 12px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .list-item .name { font-size: 13px; font-weight: 600; }
        .list-item .price { font-size: 12px; color: #ffd700; font-weight: 600; }
        .btn-upgrade { background: #ffd700; color: #000; border: none; padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- ХЕДЕР -->
    <div class="header">
        <div class="balance-pill"><span>⭐</span> <span id="balanceDisplay">1000.00</span></div>
        <button class="btn-topup">+ Пополнить</button>
    </div>

    <!-- БАРАБАН -->
    <div class="wheel-zone">
        <div class="wheel-outer">
            <div class="wheel-bg"></div>
            <!-- Оранжевый прогресс -->
            <div class="wheel-progress" id="wheelProgress"></div>
            
            <div class="wheel-inner">
                <div id="percentContainer" style="display: flex; flex-direction: column; align-items: center;">
                    <div class="percent-num" id="chanceDisplay">25.00%</div>
                    <div class="percent-lbl" id="chanceLabel">Средний шанс</div>
                </div>

                <!-- Блок результата -->
                <div class="result-container" id="resultContainer">
                    <svg class="result-icon" id="resultIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></svg>
                    <div class="result-text" id="resultText"></div>
                    <div class="result-gift-info" id="resultGiftInfo">
                        <div class="result-gift-name" id="resultGiftName"></div>
                        <div class="result-gift-id" id="resultGiftId"></div>
                    </div>
                </div>
            </div>
            
            <!-- Стрелка -->
            <div class="arrow-container" id="arrowContainer">
                <svg class="arrow-svg" viewBox="0 0 20 32" xmlns="http://www.w3.org/2000/svg">
                    <path d="M10 32 L0 12 L6 12 L6 0 L14 0 L14 12 L20 12 Z" fill="#ffd700"/>
                </svg>
            </div>
        </div>
    </div>

    <!-- КАРТОЧКИ ПОДАРКОВ -->
    <div class="gift-cards">
        <div class="gift-card active" onclick="selectGift(this, 100, 'Кубок', '#12345')">
            <div class="gift-price">⭐ 100</div>
            <img src="https://cdn-icons-png.flaticon.com/512/3113/3113549.png" class="gift-img" alt="Кубок">
            <div class="gift-name">Кубок</div>
            <div class="gift-sub">Обычный</div>
        </div>
        <div class="gift-card" onclick="selectGift(this, 3.19, 'Xmas Stocking', '#200912')">
            <div class="gift-price blue">🌍 3.19</div>
            <img src="https://cdn-icons-png.flaticon.com/512/4213/4213230.png" class="gift-img" alt="Подарок">
            <div class="gift-name">Xmas Stocking</div>
            <div class="gift-sub">#200912</div>
        </div>
    </div>

    <!-- УПРАВЛЕНИЕ -->
    <div class="controls">
        <div class="action-row">
            <div class="btn-icon"><svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg></div>
            <button class="btn-boost" id="spinBtn" onclick="spin()">Забустить</button>
            <div class="btn-icon" onclick="openSettings()"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></div>
        </div>
        
        <!-- Шансы по центру -->
        <div class="chances-grid">
            <div class="chance-btn" onclick="setChance(50, this)">x2</div>
            <div class="chance-btn active" onclick="setChance(25, this)">x4</div>
            <div class="chance-btn" onclick="setChance(1, this)">x100</div>
            <div class="chance-btn red" onclick="setChance(35, this)">35%</div>
            <div class="chance-btn yellow" onclick="setChance(55, this)">55%</div>
            <div class="chance-btn green" onclick="setChance(75, this)">75%</div>
        </div>
    </div>

    <!-- ВКЛАДКИ -->
    <div class="tabs-container">
        <div class="tabs">
            <div class="tab active" onclick="switchTab('inv', this)">Мои предметы</div>
            <div class="tab" onclick="switchTab('wish', this)">Желаемые подарки</div>
        </div>
    </div>

    <!-- СПИСКИ -->
    <div class="list-container" id="inv-section">
        <div class="list-item">
            <div class="name">🎁 Кубок</div>
            <div class="price">⭐ 100</div>
            <button class="btn-upgrade" onclick="startUpgrade('Кубок')">Апгрейд</button>
        </div>
        <div class="list-item">
            <div class="name">🎄 Xmas Stocking</div>
            <div class="price">🌍 3.19</div>
            <button class="btn-upgrade" onclick="startUpgrade('Xmas Stocking')">Апгрейд</button>
        </div>
    </div>

    <div class="list-container hidden" id="wish-section">
        <div class="list-item">
            <div class="name">🎁 Redo</div>
            <div class="price">⭐ 100,000</div>
        </div>
        <div class="list-item">
            <div class="name">🎄 Xmas Stocking</div>
            <div class="price">🌍 3.19</div>
        </div>
    </div>

    <!-- МОДАЛКА -->
    <div id="settingsModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:100; justify-content:center; align-items:center;">
        <div style="background:#111116; padding:20px; border-radius:16px; width:80%; text-align:center; border:1px solid #22222a;">
            <h3 style="margin-bottom:15px;">Свой шанс</h3>
            <input type="number" id="customChanceInput" style="width:100%; padding:12px; margin-bottom:15px; background:#000; border:1px solid #333; color:#fff; text-align:center; border-radius:8px; font-size:16px;">
            <button onclick="applyCustomChance()" style="width:100%; padding:14px; background:#ffd700; border:none; border-radius:8px; font-weight:800; cursor:pointer; font-size:16px; color:#000;">Применить</button>
            <button onclick="closeSettings()" style="width:100%; padding:12px; background:transparent; border:none; color:#888; margin-top:10px; cursor:pointer;">Отмена</button>
        </div>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram?.WebApp;
        if (tg) { tg.expand(); tg.setHeaderColor('#000000'); }

        let balance = 1000.00;
        let chance = 25;
        let rotation = 0;
        let isSpinning = false;
        let betAmount = 100;
        let currentGiftName = 'Кубок';
        let currentGiftId = '#12345';

        function updateUI() {
            document.getElementById('balanceDisplay').innerText = balance.toFixed(2);
            document.getElementById('chanceDisplay').innerText = chance.toFixed(2) + "%";
            
            // Визуальное отображение оранжевой полоски (шанса)
            const progress = document.getElementById('wheelProgress');
            progress.style.opacity = '1';
            
            // Делаем так, чтобы полоска шла от низа (6 часов) по часовой стрелке
            // В CSS: 0% = 0deg (справа), 25% = 90deg (снизу), 50% = 180deg (слева), 75% = 270deg (сверху)
            // Нам нужно, чтобы начало было внизу (90deg), а конец зависел от шанса.
            // Для простоты сделаем так: полоска всегда растет вправо-вверх от низа.
            const deg = (chance / 100) * 360;
            progress.style.transform = `rotate(${deg - 90}deg)`; 
        }

        function setChance(val, el) {
            if (isSpinning) return;
            chance = val;
            document.querySelectorAll('.chance-btn').forEach(b => b.classList.remove('active'));
            el.classList.add('active');
            updateUI();
        }

        function selectGift(el, price, name, id) {
            if (isSpinning) return;
            document.querySelectorAll('.gift-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            betAmount = price;
            currentGiftName = name;
            currentGiftId = id;
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            
            if (tab === 'inv') {
                document.getElementById('inv-section').classList.remove('hidden');
                document.getElementById('wish-section').classList.add('hidden');
            } else {
                document.getElementById('inv-section').classList.add('hidden');
                document.getElementById('wish-section').classList.remove('hidden');
            }
        }

        function startUpgrade(giftName) {
            if (tg) tg.showAlert(`Выбран предмет для апгрейда: ${giftName}.`);
        }

        function openSettings() {
            if (isSpinning) return;
            document.getElementById('settingsModal').style.display = 'flex';
            document.getElementById('customChanceInput').value = chance;
        }

        function closeSettings() {
            document.getElementById('settingsModal').style.display = 'none';
        }

        function applyCustomChance() {
            let val = parseFloat(document.getElementById('customChanceInput').value);
            if (isNaN(val) || val < 1) val = 1;
            if (val > 99) val = 99;
            chance = val;
            document.querySelectorAll('.chance-btn').forEach(b => b.classList.remove('active'));
            closeSettings();
            updateUI();
        }

        function spin() {
            if (isSpinning) return;
            if (balance < betAmount) {
                if (tg) tg.showAlert("Недостаточно средств!");
                return;
            }

            isSpinning = true;
            const btn = document.getElementById('spinBtn');
            const arrow = document.getElementById('arrowContainer');
            const percentContainer = document.getElementById('percentContainer');
            const resultContainer = document.getElementById('resultContainer');
            const resultIcon = document.getElementById('resultIcon');
            const resultText = document.getElementById('resultText');
            const resultGiftInfo = document.getElementById('resultGiftInfo');
            const resultGiftName = document.getElementById('resultGiftName');
            const resultGiftId = document.getElementById('resultGiftId');

            resultContainer.classList.remove('show');
            percentContainer.style.opacity = '1';
            
            btn.innerText = "Крутим...";
            btn.disabled = true;

            balance -= betAmount;
            updateUI();

            const isWin = (Math.random() * 100) <= chance;

            let targetDeg = isWin ? 0 : 180;
            targetDeg += (Math.random() * 40 - 20);

            let currentMod = rotation % 360;
            let diff = targetDeg - currentMod;
            if (diff < 0) diff += 360;

            rotation += (5 * 360) + diff;
            arrow.style.transform = `rotate(${rotation}deg)`;

            setTimeout(() => {
                arrow.style.transition = 'none';
                rotation = rotation % 360;
                arrow.style.transform = `rotate(${rotation}deg)`;
                setTimeout(() => { arrow.style.transition = 'transform 3.5s cubic-bezier(0.1, 0.7, 0.1, 1)'; }, 50);

                // Прячем проценты
                percentContainer.style.opacity = '0';

                if (isWin) {
                    resultIcon.innerHTML = '<polyline points="20 6 9 17 4 12"></polyline>';
                    resultIcon.style.color = '#4cd964';
                    resultText.innerText = 'Удача!';
                    resultText.className = 'result-text win';
                    resultGiftInfo.style.display = 'block';
                    resultGiftName.innerText = currentGiftName;
                    resultGiftId.innerText = currentGiftId;
                    
                    let multiplier = 100 / chance;
                    let winAmount = Math.floor(betAmount * multiplier);
                    balance += winAmount;
                    
                    if (tg) tg.showAlert(`🎉 ВЫИГРАЛ!\n+${winAmount} ⭐`);
                } else {
                    resultIcon.innerHTML = '<line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line>';
                    resultIcon.style.color = '#666';
                    resultText.innerText = 'Неудача';
                    resultText.className = 'result-text lose';
                    resultGiftInfo.style.display = 'none';
                    
                    if (tg) tg.showAlert(`💀 ПРОИГРАЛ!\n-${betAmount} ⭐`);
                }

                resultContainer.classList.add('show');
                updateUI();

                setTimeout(() => {
                    resultContainer.classList.remove('show');
                    percentContainer.style.opacity = '1';
                    
                    isSpinning = false;
                    btn.disabled = false;
                    btn.innerText = "Забустить";
                }, 3000);

            }, 2500);
        }

        updateUI();
    </script>
</body>
</html>
